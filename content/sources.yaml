  note: "На странице указано © 2003–2009. Раздел «Морфология и биология»: многолетник 10–70 см, голый или немного опушённый; листья прикорневые, черешковые, пластинки до 12 см, широкояйцевидные или эллиптические, цельнокрайние, голые, с тремя-семью дугообразными жилками; цветочные стрелки заканчиваются длинным цилиндрическим колосом; «Цветет с мая до сентября. Плоды созревают с июня до осени». Раздел «Экология»: на пустырях и сорных местах, вблизи жилья, дорог и на выпасаемых лугах, в посевах и на огородах; на территории бывшего СССР — европейская часть (всюду до Крайнего Севера), Кавказ, Сибирь, Дальний Восток, Средняя Азия. В списке литературы страницы — «Атлас ареалов и ресурсов лекарственных растений СССР» (1983)."

