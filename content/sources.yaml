  authors: ["Яковлев Г. П."]
  publisher: "Большая российская энциклопедия"
  year: 2014
  url: "https://bigenc.ru/c/podorozhnik-rod-rastenii-82c63f"
  note: "Статья БРЭ про род Plantago, первая публикация 2014, на портале с 26.05.2022, обновлена 25.07.2023. Открыта через архивную копию страницы (web.archive.org, 13.12.2024): основной адрес сейчас перенаправляет на зеркало. Использована фраза: подорожник большой культивируют как лекарственное растение; листья применяют в медицине как противовоспалительное, противоязвенное и ранозаживляющее средство и включают в чайные сборы от кашля (в статье о роде в целом, видовых оговорок нет); месяцев цветения нет."

- id: ema-plantaginis-lanceolatae-folium
