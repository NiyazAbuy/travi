  year: 2022
  url: "https://www.bayceer.uni-bayreuth.de/zertifizierung_artenkenntnis/de/allgemein/5001/0/7630/Hypericum_perforatum.pdf"
  note: "Видовой лист курса полевой ботаники, данные для Средней Европы (Германия). Даты на самом листе нет: 2022 — дата файла (HTTP Last-Modified 16.03.2022, CreationDate 16.03.2022). Использованные фразы: «Die Blütezeit reicht von Juni bis August» (период цветения); «Der Stängel ist 2-kantig ohne Flügel»; «Die ähnliche Art H. maculatum besitzt einen 4-kantigen Stängel und einen flachen Blattrand»; листья с просвечивающими точками («durchscheinend punktiert»), край листа часто загнут вниз; высота до 100 см."

