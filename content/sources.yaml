  authors: ["Berry-Bibee E. N.", "Kim M.-J.", "Tepper N. K.", "Riley H. E. M.", "Curtis K. M."]
  year: 2016
  journal: "Contraception"
  doi: "10.1016/j.contraception.2016.07.010"
  pmid: "27444983"
  note: "Из 48 найденных работ критериям отвечали 4 (сравнение комбинированных контрацептивов с зверобоем и без): в трёх — больше прорывных кровотечений, в трёх — меньшее воздействие гормонов; вывод — ограниченные данные о риске овуляции и прорывных кровотечений, возможна сниженная эффективность контрацепции. Единственное исследование без различий применяло препарат с малым содержанием гиперицина. Прочитано по аннотации в PubMed."

- id: givol-2019-calendula-wound-healing
  type: systematic_review
  title: "A systematic review of Calendula officinalis extract for wound healing"
  authors: ["Givol O.", "Kornhaber R.", "Visentin D.", "Cleary M.", "Haik J.", "Harats M."]
  year: 2019
  journal: "Wound Repair and Regeneration"
  doi: "10.1111/wrr.12737"
  pmid: "31145533"
  note: "14 исследований (7 на животных и 7 клинических) экстракта цветков календулы как монотерапии. Для острых ран есть некоторые свидетельства пользы (быстрее проходит фаза воспаления, больше грануляционной ткани), для хронических ран и ожогов результаты разные, часть клинических исследований пользы не показала; нужны более крупные РКИ. Прочитано по аннотации в PubMed."

- id: bayreuth-artenkenntnis-hypericum-perforatum
  type: reference_book
  title: "Hypericum perforatum, Echtes Johanniskraut (Qualifizierung Feldbotanik – Bronze)"
