  authors: ["Najafian Y.", "Hamedi S. S.", "Farshchi M. K.", "Feyzabadi Z."]
  year: 2018
  journal: "Electronic Physician"
  doi: "10.19082/6390"
  pmid: "29629064"
  note: "10(2):6390–6399, открытый доступ (PMC5878035). Прочитан полный текст. Нарративный обзор по книгам традиционной персидской медицины (X–XVIII вв.) и базам данных. Раздел 3.1.3: традиционное применение — полоскание соком или отваром листьев при заболеваниях рта и горла, лёгочные, желудочно-кишечные, кожные (раны, ожоги). Разделы 3.2.4.13–3.2.4.14: возможные побочные реакции (тошнота, рвота, диарея, анорексия, вздутие, гиперчувствительность, дерматит; анафилаксия при передозировке — со ссылкой на другой обзор), авторы называют растение безопасным и не относящимся к наиболее токсичным (низкое содержание щавелевой и эруковой кислот). Дозировки в обзоре приведены по другому обзору."

