  authors: ["Плантариум: растения и лишайники России и сопредельных стран"]
  year: 2026
  url: "https://www.plantarium.ru/page/view/item/28567.html"
  note: "Определитель-галерея растений. Раздел «Ботаническое описание» воспроизводит описание вида из «Флоры СССР» (т. XXIII, 1958, с. 156–157): многолетник 8–70 см со стержневым корнем; листья эллиптически-ланцетные, ланцетные или линейно-ланцетные, с 3–5(7) жилками, к основанию и верхушке постепенно суженные; цветоносы продольно бороздчатые; колосья густые, компактные, головчатые или цилиндрические, 0,5–7 см длиной; «Цветение в IV—IX(X)». Русскоязычные названия: подорожник ланцетный, ланцетовидный, ланцетолистный. Страница обновляется постоянно, открыта 17.10.2026."

- id: label-shipovnika-plody-nizkovitaminnye-krasnogorsk
  type: reference_book
  title: "Шиповника плоды низковитаминные цельные — Красногорсклексредства — официальная инструкция по применению (ЛП-004642)"
  authors: ["АО «Красногорские лекарственные средства»"]
  publisher: "МЕДИ РУ (инструкция, зарегистрированная Минздравом РФ, по данным ГРЛС)"
  year: 2018
  url: "https://medi.ru/instrukciya/shipovnika-plody-nizkovitaminnye_24826/"
  note: "Регистрационный номер ЛП-004642. Разделы: состав и действующие вещества (органические кислоты, флавоноиды, каротиноиды, пектиновые и дубильные вещества, витамины группы B, P, K, C), показания (комплексная терапия дискинезии желчевыводящих путей по гипомоторному типу, хронического гепатита, гепатохолецистита, некалькулёзного холецистита), противопоказания (повышенная чувствительность, холелитиаз, детский возраст до 12 лет), беременность и лактация, способ применения (настой 10 г на 200 мл на водяной бане 15 мин, охлаждение 45 мин; взрослым по 1/2 стакана 2–3 раза в день за 30 минут до еды, тёплым; курс 2–3 недели), побочное действие (аллергические реакции), взаимодействие (не описано), хранение настоя — не более 2 суток в прохладном месте. Год на странице не указан; 2018 — ориентировочно, по дате регистрации ЛП-004xxx (уточнить в ГРЛС)."

- id: christensen-2008-rosehip-oa
  type: systematic_review
  title: "Does the hip powder of Rosa canina (rosehip) reduce pain in osteoarthritis patients? — a meta-analysis of randomized controlled trials"
  authors: ["Christensen R", "Bartels EM", "Altman RD", "Astrup A", "Bliddal H"]
  year: 2008
  doi: "10.1016/j.joca.2008.03.001"
  pmid: "18407528"
  note: "Osteoarthritis and Cartilage 2008;16(9):965–972. Метаанализ 3 РКИ (287 пациентов, около 3 месяцев): порошок плодов шиповника уменьшал боль по сравнению с плацебо, эффект небольшой–умеренный (ES 0,37), ответ на лечение примерно вдвое чаще (NNT 6). Все исследования поддержаны производителем (Hyben-Vital); авторы считают данные скудными и просят независимые крупные испытания. Прочитана аннотация."
