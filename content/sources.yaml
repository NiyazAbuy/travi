- id: samuelsen-2000-plantago-major
  type: article
  title: "The traditional uses, chemical constituents and biological activities of Plantago major L. A review"
  authors: ["Samuelsen A. B."]
  year: 2000
  journal: "Journal of Ethnopharmacology"
  doi: "10.1016/S0378-8741(00)00212-9"
  pmid: "10904143"
  note: "71(1–2):1–21, открытый доступ (PMC7142308). Прочитан полный текст. Раздел «History»: использование листьев при ранах описано Диоскоридом (I в.), у викингов, во «Flora Danica» (1648). Таблица 1 «Some uses of Plantago major L. in traditional medicine»: по этнофармакологическим работам — кожа (раны, ожоги, порезы, укусы насекомых), органы дыхания (кашель, астма и бронхит, простуда, воспаление горла), пищеварение, мочеполовая система и др. Раздел «Toxicity»: данные по генотоксичности in vitro противоречивы (положительные результаты теста Эймса для отвара и теста «комет» для солевого экстракта, отрицательные в других опытах), у крыс острая токсичность при приёме внутрь низкая (LD50 больше 4000 мг/кг). Клинических испытаний обзор не приводит."

- id: najafian-2018-plantago-major
