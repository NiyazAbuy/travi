id: cinnamomum-verum
name: Корица цейлонская
other_names: [ "корица", "коричник цейлонский" ]
latin: Cinnamomum verum J.Presl
family: lauraceae
status: draft
life_form: tree
sourcing: [ pharmacy ]
photos:
  - file: closeup.webp
    kind: closeup
    caption: Снятие коры с побегов на Шри-Ланке
  - file: raw.webp
    kind: raw
    caption: Высушенная кора — палочки корицы
illustration: { file: illustration.webp, kind: plant }
summary: >-
  Тропическое вечнозелёное дерево; пряность — его высушенная кора, свёрнутая в трубочки. Чай из коры традиционно пьют при лёгких спазмах и вздутии живота и при лёгкой диарее.
description: >-
  Вечнозелёное тропическое дерево семейства лавровых с плотными кожистыми листьями, у которых три хорошо заметные дугообразные жилки, и метёлками мелких желтовато-белых цветков. Пряность — внутренняя кора молодых побегов: её снимают, сушат в тени, и при сушке она сворачивается в трубочки. В средней полосе не растёт — сырьё только покупное.
habitats: []
harvest:
  - part: bark
    months: [ 5, 11 ]
    how: >-
      В России не растёт, сырьё покупают. В Керале (Индия) деревья готовы к сбору примерно через 3 года после посадки, кору снимают в два сезона — в мае и в ноябре, когда она легко отделяется от побегов (KAU).
    drying: >-
      Кору сушат в тени: под прямым солнцем она коробится (KAU).
    storage: >-
      Храните в сухом, хорошо проветриваемом месте, защищённом от света, насекомых и грызунов, при относительной влажности воздуха не более 65 %.
    sources:
      - { id: kau-cinnamon-harvesting }
      - { id: gf15-khranenie-lrs, page: "общие требования" }
substances: []
actions: [ antispasmodic ]
indications:
  - indication: gi-minor-complaints
    evidence:
      level: traditional
      note: >-
        EMA (2011): традиционное применение — облегчение лёгких спазматических жалоб со стороны желудка и кишечника, в том числе вздутия и метеоризма; основано только на многолетнем опыте.
    sources:
      - { id: ema-cinnamomi-cortex, page: "4.1" }
  - indication: diarrhoea-mild
    evidence:
      level: traditional
      note: >-
        EMA (2011): традиционное применение — облегчение лёгкой диареи; основано только на многолетнем опыте.
    sources:
      - { id: ema-cinnamomi-cortex, page: "4.1" }
usage:
  - form: tea
    recipe: 0,5–1 г измельчённой коры залить кипятком и настоять (объём воды и время в монографии не указаны).
    dosage: Взрослым и пожилым — до 4 раз в день.
    course: >-
      При спазмах и вздутии — если держатся дольше 2 недель, при диарее — дольше 2 дней, обратиться к врачу или квалифицированному специалисту.
    for_indications: [ gi-minor-complaints, diarrhoea-mild ]
    sources:
      - { id: ema-cinnamomi-cortex, page: "4.2" }
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 18
  toxicity: none
  contraindications:
    - "Аллергия на корицу или на перуанский бальзам — применять нельзя (EMA 4.3)."
  warnings:
    - "При диарее прежде всего восполняйте потерю жидкости; если диарея повторяется или в стуле кровь — обратиться к врачу (EMA 4.4)."
    - "Детям и подросткам до 18 лет: применение не установлено из-за нехватки данных — не рекомендуется (EMA 4.4)."
    - "Беременность и кормление: безопасность не установлена; из-за нехватки данных применять не рекомендуется (EMA 4.6)."
  side_effects:
    - "Побочных действий не известно (EMA 4.8)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - { id: ema-cinnamomi-cortex, page: "4.2–4.9" }
sources:
  - { id: kau-cinnamon-harvesting }
