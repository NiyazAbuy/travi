id: plantago-major
name: Подорожник большой
other_names: ["подорожник обыкновенный"]
latin: Plantago major L.
family: plantaginaceae
status: draft
life_form: herb
sourcing: [wild, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: "Подорожник большой: розетка широких яйцевидных листьев и длинные тонкие колосья на цветочных стрелках"
  - file: closeup.webp
    kind: closeup
    caption: Листья крупным планом — широкие, цельнокрайние, с дугообразными жилками, на черешках
description: >-
  Многолетник высотой 10–70 см, голый или немного опушённый, с коротким корневищем и тонкими мочковатыми корнями. Листья
  собраны в прикорневую розетку и сидят на черешках; пластинки широкояйцевидные или эллиптические, цельнокрайние
  (реже слабозубчатые у основания), голые, с 3–7 дугообразными жилками; по ГФ листья вместе с черешком до 24 см длиной,
  3–11 см шириной, черешок крылатый. Восходящие цветочные стрелки заканчиваются длинным цилиндрическим колосом, густо
  усаженным мелкими невзрачными цветками со светло-бурым венчиком. Запах слабый, водное извлечение слабогорьковатое.
  Цветёт с мая до сентября.
habitats: [roadside, wasteland, field, garden, meadow]
harvest:
  - part: leaf
    months: [5, 6, 7, 8, 9]
    how: >-
      Собирают листья в период цветения. Нужны листья без потемневших и почерневших: по ГФ в цельном сырье допускается не
      более 5 % таких листьев, не более 1 % цветочных стрелок, не более 1 % органической и не более 1 % минеральной
      примеси. Собирать лучше в сухую погоду, не по росе и не после дождя; срезанное сразу кладут в чистую сухую тару, а
      не на землю (EMA GACP, раздел 11). Цветёт с мая до сентября (AgroAtlas — данные для бывшего СССР: европейская
      часть всюду до Крайнего Севера). ГФ называет примесью в сырье другие подорожники — средний и ланцетный (см.
      «С чем можно спутать»).
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; на земле
      сушить нельзя, а под прямым солнцем — только если это не вредит качеству. До сушки сырьё не следует держать под
      прямым солнцем, его нужно защищать от дождя. Сырьё должно просыхать равномерно, иначе появится плесень.
      Температуру и время выбирают с учётом части растения (лист) и состава действующих веществ; конкретных цифр в
      источниках для подорожника нет. Готовое сырьё по ГФ — влажность не более 14 %.
    storage: >-
      Хранят в чистом, хорошо проветриваемом помещении, защищённом от насекомых и грызунов, от прямого и яркого
      рассеянного света, при относительной влажности воздуха не более 65 %; воздух должен свободно циркулировать.
      Запасы ежегодно перебирают и проверяют на вредителей и на соответствие сроку годности. Срок годности для
      подорожника в ГФ не указан; в инструкции на аптечное сырьё «Фитобот» — 3 года, хранить в сухом защищённом от
      света месте.
    sources:
      - {id: gf14-plantaginis-majoris-folia, page: "определение, внешние признаки, испытания"}
      - {id: agroatlas-plantago-major, page: "Морфология и биология (цветение)"}
      - {id: ema-gacp-2025, page: "11, 12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
      - {id: label-podorozhnika-bolshogo-listya-fitobot, page: "условия хранения, срок годности"}
substances: [mucilage, aucubin, flavonoids, tannins]
actions: [expectorant, mucolytic, anti-inflammatory]
indications:
  - indication: bronchitis-tracheitis
    evidence:
      level: traditional
      note: >-
        Показание зарегистрированных в России инструкций на листья подорожника большого: отхаркивающее средство при
        заболеваниях дыхательных путей (бронхит, трахеит), как правило в составе комплексной терапии (в инструкции
        «Иванчай» — «воспалительные заболевания дыхательных путей, в том числе бронхит, трахеит»); по инструкции
        «Фитобот», настой усиливает секрецию бронхиальных желёз, действует муколитически и противовоспалительно.
        Клинических данных инструкции не приводят. Нарративный обзор 2025 г. по подорожнику большому (по аннотации)
        описывает в клинических исследованиях уменьшение кашля и признаков бронхита, но подчёркивает, что таких
        исследований мало; в просмотренных источниках систематического обзора по этому показанию нет. Монография EMA на
        подорожник относится к другому виду (P. lanceolata) и сюда не переносится. Уровень — «традиционное».
    sources:
      - {id: label-podorozhnika-bolshogo-listya-fitobot, page: "показания, фармакодинамика"}
      - {id: boskabadi-2025-plantago-respiratory}
      - {id: samuelsen-2000-plantago-major, page: "Table 1 (Respiratory organs)"}
      - {id: bre-podorozhnik}
  - indication: minor-wounds
    evidence:
      level: folk
      note: >-
        Народное применение: по обзору Samuelsen (2000) листья подорожника большого веками применяют при ранах почти по
        всему миру (описано у Диоскорида в I в., у викингов, во «Flora Danica» 1648 г.), обзор 2018 г. отмечает
        применение при ранах и ожогах в традиционной персидской медицине; БРЭ называет листья ранозаживляющим и
        противовоспалительным средством (в статье о роде в целом). Систематический обзор доклинических исследований
        2021 г. (4 исследования на животных, во всех высокий риск смещения) не нашёл доказательств эффективности при
        заживлении ран in vivo; клинических испытаний перечисленные обзоры не приводят. Поэтому уровень — «народное», не
        выше.
    sources:
      - {id: samuelsen-2000-plantago-major, page: "History; Table 1 (Skin)"}
      - {id: najafian-2018-plantago-major, page: "3.1.3.8"}
      - {id: cardoso-2021-plantago-wound-healing}
      - {id: bre-podorozhnik}
usage:
  - form: infusion
    recipe: >-
      Около 10 г (2 столовые ложки) листьев кладут в эмалированную посуду, заливают 200 мл горячей кипячёной воды,
      закрывают крышкой и нагревают на кипящей водяной бане 15 минут, затем оставляют остывать при комнатной температуре
      45 минут, процеживают и отжимают сырьё. Объём доводят кипячёной водой до 200 мл. Перед применением настой
      взбалтывают. Готовый настой хранят в тёмном прохладном месте не более 2 суток.
    dosage: >-
      Внутрь за 30 минут до еды. По инструкции «Фитобот» взрослым и детям старше 12 лет — по 1 столовой ложке 2–3 раза в
      день. Инструкции других производителей отличаются: в части из них — 2 столовые ложки 2–3 раза в день, в одной —
      по 1/2 стакана, а у некоторых настой принимают после еды. Детские дозы в инструкциях тоже различаются (в том числе
      границы возрастных групп) и здесь не приводятся: смотрите инструкцию к конкретной упаковке.
    course: 7–10 дней (по инструкции).
    for_indications: [bronchitis-tracheitis]
    sources:
      - {id: label-podorozhnika-bolshogo-listya-fitobot, page: "способ применения и дозы"}
  - form: compress
    recipe: >-
      По описаниям традиционного применения: свежие листья (в этнофармакологических работах — также помятые) прикладывали
      к ране или смазывали рану соком; в описании 1648 г. («Flora Danica») из листьев предварительно вынимали жилки.
    dosage: >-
      Современных доз и сроков в источниках нет. По тому же историческому описанию листья прикладывали утром и вечером.
      Эффективность при ранах не подтверждена: систематический обзор 2021 г. не нашёл доказательств эффективности in vivo.
    for_indications: [minor-wounds]
    sources:
      - {id: samuelsen-2000-plantago-major, page: "History; Table 1 (Skin)"}
      - {id: cardoso-2021-plantago-wound-healing}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: unknown
  toxicity: low
  contraindications:
    - "Повышенная чувствительность (аллергия) к препаратам подорожника большого (инструкции)."
    - "Повышенная секреция желудочного сока и язвенная болезнь желудка и двенадцатиперстной кишки в период обострения — противопоказаны во всех открытых инструкциях; гиперацидный гастрит (гастрит с повышенной кислотностью) — в большинстве. По инструкции, настой стимулирует выделение желудочного сока и повышает его кислотность."
  warnings:
    - "Беременность и кормление: по инструкциям применение возможно, если ожидаемая польза для матери превышает потенциальный риск для плода и ребёнка; необходима консультация врача (Фитобот, Магнолия, Иванчай). В одной инструкции указано просто «возможно»."
    - "Дети: в инструкциях разных производителей приведены детские дозы (вплоть до группы «дети до 3 лет»), нижняя граница возраста не указана, а возрастные группы различаются; независимых данных о безопасности для детей в источниках нет, поэтому в поле «Дети» стоит «нет данных»."
    - "Если симптомы сохраняются или состояние ухудшается в течение 7 дней, сообщить врачу (инструкция Иванчай, ЛП-001813)."
    - "Монография EMA на подорожник (EMA/HMPC/887979/2022: раздражение рта и горла с сухим кашлем, кашель при простуде, лёгкое воспаление кожи) относится к подорожнику ланцетному (Plantago lanceolata). Для подорожника большого такой монографии нет, её показания, дозы и предостережения в этой карточке не используются."
    - "Лабораторные данные о генотоксичности экстрактов подорожника большого противоречивы: отвар листьев в одной работе вызывал мутации в тесте Эймса, солевой экстракт — повреждения ДНК в тесте «комет», в других опытах генотоксичности не нашли (Samuelsen, 2000, раздел 6). Это опыты на бактериях и клетках; обзор 2018 г. в целом называет растение безопасным."
    - "Влияние на способность управлять транспортом: по инструкции «Фитобот» не оказывает."
  side_effects:
    - "Возможны аллергические реакции, в редких случаях — изжога (инструкции всех открытых производителей)."
    - "Обзор 2018 г. (со ссылкой на другой обзор) перечисляет возможные реакции: тошнота, рвота, диарея, снижение аппетита, вздутие, гиперчувствительность, дерматит; при передозировке в тяжёлых случаях — анафилаксия."
    - "Передозировка: в большинстве инструкций случаев не зарегистрировано; в одной (Иванчай) указано возможное усиление изжоги, лечение симптоматическое."
  interactions:
    - "Не рекомендуется сочетать с противокашлевыми средствами, в том числе с кодеином: это затрудняет отхождение разжиженной мокроты (инструкции Фитобот, Валерия, Иванчай). В других инструкциях взаимодействия не описаны."
  sources:
    - {id: label-podorozhnika-bolshogo-listya-fitobot, page: "противопоказания, беременность и лактация, побочные эффекты, передозировка, взаимодействие"}
    - {id: najafian-2018-plantago-major, page: "3.2.4.13–3.2.4.14"}
    - {id: samuelsen-2000-plantago-major, page: "6 (Toxicity)"}
    - {id: ema-plantaginis-lanceolatae-folium, page: "4.1, 4.8, 4.9"}
lookalikes:
  - name: Подорожник ланцетный (подорожник ланцетолистный)
    latin: Plantago lanceolata L.
    poisonous: false
    differences: >-
      Ядовитым не является: монография EMA на этот вид сообщает, что нежелательные эффекты неизвестны (4.8) и случаев
      передозировки не описано (4.9). Он тоже лекарственный, но данные EMA о нём нельзя переносить на подорожник большой.
      Различают по листьям: у подорожника большого они широкояйцевидные или эллиптические, на черешках, голые с
      обеих сторон, с 3–7 дугообразными жилками (ГФ, AgroAtlas); у ланцетного — эллиптически-ланцетные, ланцетные или
      линейно-ланцетные, с 3–5(7) жилками, к основанию и верхушке постепенно суженные (Флора СССР), удлинённо-ланцетовидные
      и опушённые по жилкам (ГФ). Колос у большого длинный цилиндрический, густо усаженный мелкими цветками (AgroAtlas);
      у ланцетного густой, компактный, головчатый или цилиндрический, 0,5–7 см длиной (Флора СССР). ГФ называет
      примесью в сырье подорожника большого и ланцетный, и средний подорожник (у среднего пластинка эллиптическая,
      опушённая, особенно по жилкам и краю).
    photo:
      file: twin-plantago-lanceolata.webp
      kind: plant
      caption: Подорожник ланцетный — розетка узких удлинённых листьев, цветоносы с короткими густыми колосками
