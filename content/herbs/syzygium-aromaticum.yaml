id: syzygium-aromaticum
name: Гвоздичное дерево
other_names: [ "гвоздика (пряность)" ]
latin: Syzygium aromaticum (L.) Merr. & L.M.Perry
family: myrtaceae
status: draft
life_form: tree
sourcing: [ pharmacy ]
photos:
  - file: plant.webp
    kind: plant
    caption: Гвоздичное дерево с кистями бутонов
  - file: raw.webp
    kind: raw
    caption: Высушенные бутоны — пряность «гвоздика»
illustration: { file: illustration.webp, kind: plant }
summary: >-
  Тропическое дерево; пряность «гвоздика» — это его высушенные нераскрывшиеся бутоны. Гвоздичное масло традиционно применяют для полоскания рта при лёгком воспалении и как временную помощь при зубной боли до визита к стоматологу.
description: >-
  Вечнозелёное тропическое дерево семейства миртовых с кожистыми блестящими листьями. Цветки собраны в кисти; пряность — нераскрывшиеся бутоны, которые срывают, когда основание чашечки из зелёного становится розовым, и сразу сушат: они становятся ярко-коричневыми и твёрдыми. Из сухих бутонов перегонкой с паром получают гвоздичное масло. В средней полосе не растёт — сырьё только покупное.
habitats: []
harvest:
  - part: buds
    months: []
    how: >-
      В России не растёт, сырьё покупают. Деревья начинают давать урожай через 7–8 лет после посадки. Бутоны собирают, когда основание чашечки из зелёного стало розовым, отделяя их от соцветий руками (KAU). Месяцы сбора зависят от страны и года — в доступных источниках они не указаны.
    drying: >-
      Сушат сразу после отделения от соцветий; в солнечную погоду сушка длится 4–5 дней. Хорошо высушенная гвоздика — ярко-коричневая и не гнётся при нажатии (KAU).
    storage: Высушенную гвоздику перебирают и хранят в сухом месте (KAU).
    sources:
      - { id: kau-clove-harvesting }
substances: [ essential-oil ]
actions: []
indications:
  - indication: mouth-throat-inflammation
    evidence:
      level: traditional
      note: >-
        EMA (2011): традиционное применение гвоздичного масла — полоскания при лёгких воспалениях во рту и горле; основано только на многолетнем опыте. Речь именно о масле, а не о бутонах.
    sources:
      - { id: ema-caryophylli-floris-aetheroleum, page: "4.1" }
  - indication: toothache-temporary
    evidence:
      level: traditional
      note: >-
        EMA (2011): традиционное применение гвоздичного масла — временное облегчение зубной боли при кариесе; это только временная мера, к стоматологу нужно обратиться как можно скорее.
    sources:
      - { id: ema-caryophylli-floris-aetheroleum, page: "4.1, 4.2" }
usage:
  - form: rinse
    recipe: Полоскание для рта с 1–5 % гвоздичного масла (готовое средство для полоскания).
    dosage: Взрослым и пожилым — несколько раз в день. Не дольше недели.
    course: Если симптомы не проходят — обратиться к врачу или квалифицированному специалисту.
    for_indications: [ mouth-throat-inflammation ]
    sources:
      - { id: ema-caryophylli-floris-aetheroleum, page: "4.2" }
  - form: other
    recipe: >-
      Ватку смочить неразбавленным гвоздичным маслом или раствором не слабее 50 % (либо нанести гель 20 % на ватную палочку) и точно приложить к больному месту зуба, не касаясь дёсен.
    dosage: >-
      Взрослым и пожилым. Повторить через 20 минут, затем при необходимости каждые 2 часа. Не дольше недели.
    course: Это только временная мера — к стоматологу как можно скорее.
    for_indications: [ toothache-temporary ]
    sources:
      - { id: ema-caryophylli-floris-aetheroleum, page: "4.2, 4.4" }
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 18
  toxicity: moderate
  contraindications:
    - "Аллергия на гвоздичное масло или на перуанский бальзам — применять нельзя (EMA 4.3)."
  warnings:
    - "Масло — не внутрь! У детей до 2 лет 5–10 мл гвоздичного масла, выпитого внутрь, вызывали угрожающие жизни состояния: угнетение нервной системы, судороги, кому, нарушения работы печени и почек, низкий сахар крови. Храните масло недоступно для детей (EMA 4.9)."
    - "При зубной боли не допускать попадания масла на дёсны (EMA 4.4)."
    - "Детям и подросткам до 18 лет: применение не установлено из-за нехватки данных — не рекомендуется (EMA 4.4)."
    - "Беременность и кормление: безопасность не установлена; из-за нехватки данных применять не рекомендуется (EMA 4.6)."
  side_effects:
    - "Описаны раздражение слизистой и аллергические реакции; частота неизвестна (EMA 4.8)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - { id: ema-caryophylli-floris-aetheroleum, page: "4.2–4.9" }
sources:
  - { id: kau-clove-harvesting }
  - { id: ema-caryophylli-floris-aetheroleum, page: "2 (масло — перегонка с паром из сухих бутонов)" }
