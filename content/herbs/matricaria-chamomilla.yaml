id: matricaria-chamomilla
name: Ромашка аптечная
other_names: ["ромашка ободранная", "ромашка лекарственная"]
latin: Matricaria chamomilla L. (син. Matricaria recutita L.; Chamomilla recutita (L.) Rauschert)
family: asteraceae
status: draft
life_form: herb
sourcing: [wild, garden, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: Растения ромашки аптечной в цвету
  - file: closeup.webp
    kind: closeup
    caption: Корзинка с опущенными язычками и вытянутым коническим цветоложем
description: >-
  Невысокий ветвистый однолетник с дважды-трижды перисторассечёнными листьями, доли которых узкие, почти нитевидные.
  На цветоножках сидят корзинки: по краю белые язычковые цветки (их язычки отогнуты вниз), в центре жёлтые трубчатые.
  Цветоложе голое и внутри полое: в начале цветения оно полушаровидное, к концу вытягивается в конус. Растение и
  особенно корзинки сильно и характерно пахнут. Цветёт с конца мая по сентябрь.
habitats: [field, roadside, wasteland]
harvest:
  - part: flowers
    months: [6, 7, 8]
    how: >-
      Собирают цветочные корзинки в начале цветения, пока цветоложе ещё полушаровидное (позже оно становится
      коническим). Нужны корзинки без цветоносов или с остатками не длиннее 3 см; листья, стебли и корзинки с
      длинными цветоносами — примесь. Потемневшие корзинки — брак (по ГФ их допускается не более 5 %). Растение
      цветёт с конца мая по сентябрь, поэтому корзинки собирают в течение лета по мере раскрытия.
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил;
      на земле сушить нельзя, а под прямым солнцем — только если это не вредит качеству. Старайтесь, чтобы сырьё
      просыхало равномерно, иначе появится плесень. Температуру и время подбирают с учётом эфирного масла в цветках;
      конкретных цифр в источниках для ромашки нет. Готовое сырьё по ГФ — влажность не более 14 %.
    storage: >-
      Хранят в сухом, чистом, проветриваемом месте, защищённом от света и насекомых, при относительной влажности
      воздуха не более 65 %. Сырьё с эфирным маслом и запахом держат отдельно от другого, в хорошо закрытой таре.
      Запасы периодически перебирают и проверяют на вредителей (по ОФС — не реже раза в год). Срок годности для
      ромашки в ГФ не указан.
    sources:
      - {id: gf14-chamomillae-flores, page: "определение, подлинность, испытания"}
      - {id: ema-gacp-2025, page: "12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
      - {id: abipov-2021-chamomile, page: "ботаническая часть"}
substances: [essential-oil, chamazulene, bisabolol, apigenin, herniarin-umbelliferone, mucilage]
actions: [anti-inflammatory, antispasmodic]
indications:
  - indication: gi-minor-complaints
    evidence:
      level: traditional
      note: "EMA (2015): традиционное применение при лёгких расстройствах ЖКТ (вздутие, небольшие спазмы); раздела «хорошо изученное применение» в монографии нет."
    sources:
      - {id: ema-matricariae-flos, page: "4.1"}
  - indication: common-cold
    evidence:
      level: traditional
      note: "EMA (2015): традиционное применение для облегчения симптомов простуды (ингаляции); клинических данных монография не приводит."
    sources:
      - {id: ema-matricariae-flos, page: "4.1"}
  - indication: mouth-throat-inflammation
    evidence:
      level: traditional
      note: "EMA (2015): традиционное применение при лёгких язвочках и воспалении во рту и горле (полоскания); основано на давнем опыте."
    sources:
      - {id: ema-matricariae-flos, page: "4.1"}
  - indication: anogenital-irritation
    evidence:
      level: traditional
      note: "EMA (2015): традиционное вспомогательное применение при раздражении кожи и слизистых в анальной и половой области, только после исключения серьёзных причин врачом."
    sources:
      - {id: ema-matricariae-flos, page: "4.1"}
  - indication: skin-minor-inflammation
    evidence:
      level: traditional
      note: "EMA (2015): традиционное применение при лёгком воспалении кожи (солнечный ожог), поверхностных ранах и небольших фурункулах."
    sources:
      - {id: ema-matricariae-flos, page: "4.1"}
usage:
  - form: tea
    recipe: >-
      Залить 1,5–4 г сырья 150 мл кипятка, заварить как травяной настой и процедить (время настаивания в монографии
      не указано).
    dosage: >-
      Взрослым и подросткам — 3–4 раза в день. Детям одна порция сырья: 6 месяцев – 2 года 0,5–1 г, 2–6 лет 1–1,5 г,
      6–12 лет 1,5–3 г, 2–4 раза в день. Младше 6 месяцев внутрь не рекомендуется.
    course: Если симптомы держатся дольше недели — обратиться к врачу.
    for_indications: [gi-minor-complaints]
    sources:
      - {id: ema-matricariae-flos, page: "4.2"}
  - form: other
    recipe: >-
      Ингаляция: 3–10 г сырья на 100 мл горячей воды, дышать паром.
    dosage: >-
      Взрослым и подросткам — несколько раз в день. Детям 6–12 лет 2–5 г на 100 мл воды, 1–2 раза в день; младше
      6 лет ингаляции с ромашкой не рекомендуются из-за нехватки данных.
    course: Если симптомы держатся дольше недели — обратиться к врачу.
    for_indications: [common-cold]
    sources:
      - {id: ema-matricariae-flos, page: "4.2, 4.4"}
  - form: rinse
    recipe: >-
      Настой для полоскания рта и горла: 1–5 г сырья на 100 мл воды.
    dosage: Взрослым и подросткам — несколько раз в день. Детям младше 12 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше недели — обратиться к врачу.
    for_indications: [mouth-throat-inflammation]
    sources:
      - {id: ema-matricariae-flos, page: "4.2, 4.4"}
  - form: other
    recipe: >-
      Настой для орошения (подмывания): 4,5–5 г сырья на 1 л воды.
    dosage: >-
      Взрослым и подросткам — несколько раз в день, только после того как врач исключил серьёзные причины
      раздражения. Детям младше 12 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше недели — обратиться к врачу.
    for_indications: [anogenital-irritation]
    sources:
      - {id: ema-matricariae-flos, page: "4.1, 4.2, 4.4"}
  - form: compress
    recipe: >-
      Настой для обмываний и пропитанных повязок (примочек): 3–10 г сырья на 100 мл воды.
    dosage: Взрослым и подросткам — несколько раз в день. Детям младше 12 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше недели — обратиться к врачу.
    for_indications: [skin-minor-inflammation]
    sources:
      - {id: ema-matricariae-flos, page: "4.2, 4.4"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: caution
  toxicity: none
  contraindications:
    - "Аллергия на ромашку и на другие растения семейства астровых (сложноцветных) — применять нельзя (EMA 4.3)."
    - "Ванны с ромашкой: полные ванны противопоказаны при открытых ранах, обширных повреждениях кожи, острых кожных болезнях, высокой температуре, тяжёлых инфекциях, тяжёлых нарушениях кровообращения и сердечной недостаточности; частичные (сидячие) — при открытых ранах, обширных повреждениях кожи, острых кожных болезнях, высокой температуре и тяжёлых инфекциях (EMA 4.3)."
    - "Возраст по EMA (4.4): настой внутрь — не младше 6 месяцев; ингаляции — не младше 6 лет; полоскание рта и горла, орошения и примочки — не младше 12 лет. Для более младших детей данных недостаточно."
    - "Беременность и кормление: для настоя из сырья EMA считает безопасность установленной, а для жидких и сухих экстрактов не рекомендует их из-за нехватки данных; систематический обзор 2025 г. тоже отмечает недостаток данных, поэтому в карточке — «с осторожностью». Перед кормлением смывать с сосков кожные средства с ромашкой, чтобы не сенсибилизировать ребёнка (EMA 4.6)."
    - "Раздражение кожи и слизистых в анальной и половой области лечить ромашкой можно только после того, как врач исключил серьёзные причины (EMA 4.1)."
    - "Если симптомы ухудшаются или держатся дольше недели — обратиться к врачу (EMA 4.2, 4.4)."
  side_effects:
    - "Аллергические реакции, вплоть до тяжёлых (одышка, отёк Квинке, сосудистый коллапс, анафилактический шок), описаны после контакта слизистых с жидкими препаратами ромашки; частота неизвестна (EMA 4.8)."
    - "По систематическому обзору 2025 г., в исследованиях чаще всего отмечали жалобы со стороны ЖКТ и сонливость (лёгкие, проходящие); в описаниях отдельных случаев — аллергические реакции от острого ринита до анафилаксии."
  interactions:
    - "При приёме внутрь больших доз около двух месяцев у пациентов после пересадки почки описаны взаимодействия, связанные с влиянием на CYP450 (EMA 4.5)."
    - "При наружном применении, полоскании, ингаляциях и в ваннах взаимодействий не описано (EMA 4.5)."
  sources:
    - {id: ema-matricariae-flos, page: "4.3–4.8"}
    - {id: ostovar-2025-chamomile-ae}
lookalikes:
  - name: Ромашка непахучая (трёхрёберник непахучий)
    latin: Tripleurospermum inodorum (L.) Sch. Bip.
    poisonous: false
    differences: >-
      Корзинки очень похожи, и растёт она в тех же местах. У аптечной ромашки запах сильный и характерный, а цветоложе
      голое, удлинённо-коническое и внутри полое. У ромашки непахучей запаха нет (отсюда название), а цветоложе
      полушаровидное или ширококоническое и плотное — на продольном разрезе корзинки полости нет (см. фото). Её нельзя
      добавлять в сырьё: состав эфирного масла другой. Разрежьте корзинку вдоль и разотрите в пальцах.
    photo:
      file: twin-tripleurospermum-inodorum.webp
      kind: closeup
      caption: Продольный разрез корзинки трёхрёберника непахучего — цветоложе плотное, без полости
  - name: Нивяник обыкновенный
    latin: Leucanthemum vulgare Lam.
    poisonous: false
    differences: >-
      Многолетник: листья с продолговатой или овальной пластинкой, по краю туповато-зубчатые или городчатые, а не
      рассечённые на нитевидные доли, как у ромашки. Цветоложе слабо выпуклое и плотное (у ромашки — коническое и
      полое), корзинки обычно одиночные и заметно крупнее (обёртка 10–22 мм, у ромашки корзинка без язычков 4–8 мм).
      Лечебным сырьём не является.
sources:
