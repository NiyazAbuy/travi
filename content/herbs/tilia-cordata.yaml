id: tilia-cordata
name: Липа сердцевидная
other_names: ["липа мелколистная", "липовый цвет"]
latin: Tilia cordata Mill.
family: malvaceae
status: draft
life_form: tree
sourcing: [wild, garden, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: Цветущая липа — соцветия свисают на длинных цветоножках с крыловидным прицветным листом
  - file: closeup.webp
    kind: closeup
    caption: Соцветие с желтовато-белыми цветками и светлым прицветным листом
  - file: raw.webp
    kind: raw
    caption: Липовый цвет — высушенные соцветия вместе с прицветниками
illustration: { file: illustration.webp, kind: plant }
summary: >-
  Высокое лиственное дерево с сердцевидными листьями и душистыми соцветиями. Липовый цвет традиционно заваривают при
  простуде и при лёгком нервном напряжении.
description: >-
  Листопадное дерево высотой до 30 м. Листья плотные, округло-сердцевидные с оттянутой верхушкой и несимметричным
  основанием, мелкопильчатые по краю; снизу сизовато-зелёные, в углах жилок — пучки ржаво-бурых волосков. Соцветие
  до 10 цветков с желтовато-белыми лепестками, его цветонос наполовину сросся с длинным светлым крыловидным
  прицветным листом. Очень похожа липа широколистная (Tilia platyphyllos) — у неё листья мягче, сильнее опушены, а
  волоски в углах жилок беловатые; по ГФ сырьё обоих видов одинаково годится. Цветёт в июне–июле (данные для Средней
  Европы).
habitats: [forest, garden]
harvest:
  - part: flowers
    months: [6, 7]
    how: >-
      Соцветия собирают во время цветения вместе с прицветным листом. По ГФ в сырье допускается не больше 4 %
      потемневших частей, 2 % повреждённых вредителями или ржавчиной, 2 % отцветших соцветий с плодами и 1 % других
      частей липы (листьев, побегов). Собирать лучше в сухую погоду; собранное сразу кладут в чистую сухую тару, а не на
      землю (EMA GACP, раздел 11). Липа цветёт в июне–июле (данные для Средней Европы), точные сроки зависят от
      региона и погоды.
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; под
      прямым солнцем — только если это не вредит качеству. Сырьё должно просыхать равномерно, иначе появится плесень.
      Конкретных температур в источниках для липы нет. Готовое сырьё по ГФ — влажность не более 13 %.
    storage: >-
      Хранят в чистом, хорошо проветриваемом помещении, защищённом от насекомых и грызунов, от прямого и яркого
      рассеянного света, при относительной влажности воздуха не более 65 %. Запасы ежегодно перебирают и проверяют.
      Срок годности для липы в ГФ не указан.
    sources:
      - {id: gf15-tiliae-flores, page: "определение, испытания"}
      - {id: bayreuth-artenkenntnis-tilia-cordata}
      - {id: ema-gacp-2025, page: "11, 12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
substances: [flavonoids]
actions: []
indications:
  - indication: common-cold
    evidence:
      level: traditional
      note: >-
        EMA (2012): традиционное применение — облегчение симптомов простуды; основано только на многолетнем опыте,
        клинических данных нет.
    sources:
      - {id: ema-tiliae-flos, page: "4.1"}
  - indication: mental-stress-mild
    evidence:
      level: traditional
      note: >-
        EMA (2012): традиционное применение — облегчение лёгких проявлений психического стресса; основано только на
        многолетнем опыте.
    sources:
      - {id: ema-tiliae-flos, page: "4.1"}
usage:
  - form: tea
    recipe: >-
      1,5 г измельчённого липового цвета залить 150 мл кипятка и настоять (время настаивания в монографии не указано).
    dosage: >-
      Подросткам, взрослым и пожилым — 2–4 раза в день (в сутки 3–6 г сырья). При простуде детям 4–12 лет — по 1 г на
      150 мл 2–4 раза в день (в сутки 2–4 г). При стрессе до 12 лет не рекомендуется.
    course: >-
      При простуде начинать с первых признаков; если симптомы держатся дольше недели — обратиться к врачу или
      квалифицированному специалисту.
    for_indications: [common-cold, mental-stress-mild]
    sources:
      - {id: ema-tiliae-flos, page: "4.2"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 12
  toxicity: none
  contraindications:
    - "Аллергия (повышенная чувствительность) на липовый цвет — применять нельзя (EMA 4.3)."
  warnings:
    - "Дети: при простуде применение до 4 лет, при стрессе — до 12 лет не установлено из-за нехватки данных; в поле «Дети» указан наибольший из этих возрастов (EMA 4.2, 4.4)."
    - "При простуде: если появились одышка, высокая температура или гнойная мокрота либо симптомы ухудшаются — обратиться к врачу (EMA 4.4)."
    - "Беременность и кормление: безопасность не установлена; из-за нехватки данных применять не рекомендуется (EMA 4.6)."
  side_effects:
    - "Побочных действий не известно (EMA 4.8)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - {id: ema-tiliae-flos, page: "4.2–4.9"}
sources:
  - {id: bayreuth-artenkenntnis-tilia-cordata}
  - {id: gf15-tiliae-flores, page: "определение (липа сердцевидная и широколистная)"}
