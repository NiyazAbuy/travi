id: calendula-officinalis
name: Календула лекарственная
other_names: ["ноготки", "ноготки лекарственные"]
latin: Calendula officinalis L.
family: asteraceae
status: draft
life_form: herb
sourcing: [garden, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: "Календула в цвету: корзинки с оранжевыми язычковыми цветками, опушённые стебли"
  - file: closeup.webp
    kind: closeup
    caption: Махровая корзинка и бутоны календулы
  - file: raw.webp
    kind: raw
    caption: Сухие язычковые цветки календулы (слева — линейка)
illustration: { file: illustration.webp, kind: plant }
summary: >-
  Садовый однолетник с оранжевыми корзинками. Настой цветков традиционно используют для полосканий рта и горла и при лёгких воспалениях кожи.
description: >-
  Однолетнее травянистое растение, которое выращивают в культуре (в России — во всех регионах, кроме Крайнего Севера).
  Листья цельные, очерёдные, продолговатые, стебли ветвистые и железисто-опушённые. Крупные корзинки диаметром до 5 см:
  по краю язычковые цветки оранжевого или жёлтого цвета (у немахровых форм их 2–3 ряда, у махровых — 10–15), в середине
  трубчатые; обёртка серовато-зелёная с густо опушёнными узкими листочками, цветоложе слегка выпуклое и голое. Цветёт с
  июня по ноябрь. Запах слабый, водное извлечение солоновато-горькое.
habitats: [garden]
harvest:
  - part: flowers
    months: [6, 7, 8, 9, 10, 11]
    how: >-
      Собирают цветочные корзинки в начале распускания трубчатых цветков. Нужны корзинки без цветоносов или с остатками
      цветоносов не длиннее 3 см; по ГФ в цельном сырье допускается остатков цветоносов не более 6 %, корзинок с
      полностью осыпавшимися цветками не более 20 %, потемневших и почерневших не более 3 % и других частей растения
      (кусочки стеблей и листьев) не более 3 %. Собирать лучше в сухую погоду, не по росе и не после дождя; собранное
      сразу кладут в чистую сухую тару, а не на землю (EMA GACP, раздел 11). Календула лекарственная цветёт с июня по
      ноябрь (БРЭ); в описании рода сказано «до заморозков», поэтому конец сезона зависит от региона и погоды.
      Корзинки собирают по мере распускания, пока идёт цветение.
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; на земле
      сушить нельзя, а под прямым солнцем — только если это не вредит качеству. До сушки сырьё не следует держать под
      прямым солнцем, его нужно защищать от дождя. Сырьё должно просыхать равномерно, иначе появится плесень.
      Температуру и время выбирают с учётом части растения (цветки) и состава действующих веществ; конкретных цифр в
      источниках для календулы нет. Готовое сырьё по ГФ — влажность не более 14 %.
    storage: >-
      Хранят в чистом, хорошо проветриваемом помещении, защищённом от насекомых и грызунов, от прямого и яркого
      рассеянного света, при относительной влажности воздуха не более 65 %; воздух должен свободно циркулировать.
      Запасы ежегодно перебирают и проверяют на вредителей и на соответствие сроку годности. Срок годности для
      календулы в ГФ не указан.
    sources:
      - {id: gf14-calendulae-flores, page: "определение, подлинность, испытания"}
      - {id: bre-kalendula, page: "Ботаническое описание (период цветения)"}
      - {id: ema-gacp-2025, page: "11, 12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
substances: [flavonoids, carotenoids, triterpenoids]
actions: [anti-inflammatory]
indications:
  - indication: skin-minor-inflammation
    evidence:
      level: traditional
      note: >-
        EMA (2018): традиционное применение — симптоматическое лечение лёгких воспалений кожи (например, солнечного
        ожога) и вспомогательное средство при заживлении мелких ран; основано только на многолетнем опыте. Систематический
        обзор 2019 г. (14 исследований экстракта цветков, из них 7 клинических): есть отдельные свидетельства пользы при
        заживлении ран, но клинические результаты неоднородны (часть исследований пользы не показала) и нужны более
        крупные испытания, поэтому уровень остаётся «традиционное».
    sources:
      - {id: ema-calendulae-flos, page: "4.1, 4.2"}
      - {id: givol-2019-calendula-wound-healing}
  - indication: mouth-throat-inflammation
    evidence:
      level: traditional
      note: >-
        EMA (2018): традиционное применение — симптоматическое лечение лёгких воспалений во рту и горле (полоскания);
        основано только на многолетнем опыте. В монографии речь о воспалении, язвочки в формулировке не упоминаются.
    sources:
      - {id: ema-calendulae-flos, page: "4.1, 4.2"}
usage:
  - form: compress
    recipe: >-
      Залить 1–2 г цветков (целых или измельчённых) 150 мл воды, получить настой (время настаивания и температура воды в
      монографии не указаны). Ещё тёплым настоем пропитывают повязки.
    dosage: >-
      2–4 раза в день. Повязку снимают через 30–60 минут. Детям, подросткам, взрослым и пожилым; детям младше 6 лет не
      рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше недели или ухудшаются — обратиться к врачу или квалифицированному специалисту.
    for_indications: [skin-minor-inflammation]
    sources:
      - {id: ema-calendulae-flos, page: "4.2, 4.4"}
  - form: rinse
    recipe: >-
      Залить 1–2 г цветков (целых или измельчённых) 150 мл воды, получить настой (время настаивания и температура воды в
      монографии не указаны). Ещё тёплым настоем полощут рот и горло.
    dosage: >-
      2–4 раза в день. Подросткам, взрослым и пожилым; детям младше 12 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше недели — обратиться к врачу или квалифицированному специалисту.
    for_indications: [mouth-throat-inflammation]
    sources:
      - {id: ema-calendulae-flos, page: "4.2, 4.4"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 12
  toxicity: none
  contraindications:
    - "Аллергия (повышенная чувствительность) на календулу и на другие растения семейства астровых (сложноцветных) — применять нельзя (EMA 4.3)."
  warnings:
    - "Дети: наружно (повязки) применение до 6 лет, а полоскание рта и горла до 12 лет не установлено из-за нехватки данных — не рекомендуется; в поле «Дети» указан наибольший из этих возрастов (EMA 4.2, 4.4)."
    - "Беременность и кормление: безопасность не установлена; из-за нехватки данных применять не рекомендуется. Данных о влиянии на фертильность нет (EMA 4.6)."
    - "Если на коже появились признаки инфекции или симптомы ухудшаются — обратиться к врачу или квалифицированному специалисту (EMA 4.4)."
    - "Если симптомы держатся дольше недели — обратиться к врачу или квалифицированному специалисту (EMA 4.2)."
    - "Адекватные исследования репродуктивной токсичности и канцерогенности не проводились (EMA 5.3)."
  side_effects:
    - "Описана сенсибилизация кожи (аллергические реакции); частота неизвестна (EMA 4.8)."
    - "Случаев передозировки не описано (EMA 4.9)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - {id: ema-calendulae-flos, page: "4.2–4.9, 5.3"}
sources:
  - {id: bre-kalendula, page: "Ботаническое описание, Хозяйственное значение, Условия выращивания"}
