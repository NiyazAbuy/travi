id: curcuma-longa
name: Куркума длинная
other_names: [ "куркума", "турмерик" ]
latin: Curcuma longa L.
family: zingiberaceae
status: draft
life_form: herb
sourcing: [ pharmacy ]
photos:
  - file: closeup.webp
    kind: closeup
    caption: Соцветие куркумы с бледными прицветниками
  - file: raw.webp
    kind: raw
    caption: Свежие корневища куркумы с оранжевой мякотью
illustration: { file: illustration.webp, kind: plant }
summary: >-
  Тропическое растение семейства имбирных; его оранжевые корневища дают пряность. Порошок или чай из корневищ традиционно применяют при тяжести в желудке, медленном пищеварении и вздутии.
description: >-
  Многолетнее травянистое растение тропиков с крупными ланцетными листьями. Ценность — корневища с ярко-оранжевой мякотью: их выкапывают, отваривают и сушат, а затем мелют в порошок. Соцветие — плотный колос из зелёных и беловатых прицветников, между которыми сидят жёлтые цветки. В средней полосе в открытом грунте не растёт — сырьё только покупное.
habitats: []
harvest:
  - part: rhizome
    months: []
    how: >-
      В природе в России не растёт, сырьё покупают. В странах выращивания корневища выкапывают, когда растение и стебель засыхают — примерно через 7–10 месяцев после посадки (FAO); в Керале (Индия) уборка обычно идёт с января по март (KAU). Корневища отмачивают от земли, удаляют корни и чешуи.
    drying: >-
      Перед сушкой корневища отваривают до мягкости (около 45–60 минут), не позже чем через 2–3 дня после уборки. Сушат до влажности 5–10 %: на солнце — 10–15 дней слоем 5–7 см, в сушилке — оптимально при 60 °C (FAO).
    storage: >-
      Куркума чувствительна к свету (FAO). Храните в сухом, хорошо проветриваемом месте, защищённом от света, насекомых и грызунов, при относительной влажности воздуха не более 65 %.
    sources:
      - { id: fao-turmeric-postharvest-2004, page: "2.1, 2.2" }
      - { id: kau-turmeric-harvesting }
      - { id: gf15-khranenie-lrs, page: "общие требования" }
substances: [ curcuminoids, essential-oil ]
actions: []
indications:
  - indication: dyspepsia-flatulence
    evidence:
      level: traditional
      note: >-
        EMA (2018): традиционное применение — облегчение расстройств пищеварения (чувство переполнения, медленное пищеварение, метеоризм); основано только на многолетнем опыте.
    sources:
      - { id: ema-curcumae-longae-rhizoma, page: "4.1" }
usage:
  - form: tea
    recipe: 0,5–1 г измельчённого корневища залить 150 мл кипятка и настоять.
    dosage: Взрослым и пожилым — 2–3 раза в день. Порошок корневища — по 0,5–1 г 2–3 раза в день.
    course: Если симптомы держатся дольше 2 недель — обратиться к врачу или квалифицированному специалисту.
    for_indications: [ dyspepsia-flatulence ]
    sources:
      - { id: ema-curcumae-longae-rhizoma, page: "4.2" }
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 18
  toxicity: none
  contraindications:
    - "Аллергия (повышенная чувствительность) на куркуму — применять нельзя (EMA 4.3)."
    - "Не рекомендуется при закупорке желчных протоков, холангите, болезнях печени, желчнокаменной болезни и других болезнях желчных путей — куркума может усиливать отток желчи (EMA 4.4)."
  warnings:
    - "Детям и подросткам до 18 лет: применение не установлено из-за нехватки данных — не рекомендуется (EMA 4.4)."
    - "Беременность и кормление: безопасность не установлена; из-за нехватки данных применять не рекомендуется (EMA 4.6)."
    - "Речь о корневище и порошке в обычных дозах. Высокодозные добавки с куркумином повышенной всасываемости (часто с экстрактом перца) — другое дело: EMA (2025) связывает с ними риск поражения печени; в дозах монографии таких случаев не описано."
  side_effects:
    - "Возможны лёгкие сухость во рту, вздутие и раздражение желудка; частота неизвестна (EMA 4.8)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - { id: ema-curcumae-longae-rhizoma, page: "4.2–4.9" }
    - { id: ema-curcumae-addendum-2025, page: "выводы о гепатотоксичности" }
sources:
  - { id: fao-turmeric-postharvest-2004, page: "1, 1.3 (корневища, куркуминоиды, эфирное масло)" }
