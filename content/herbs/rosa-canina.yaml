id: rosa-canina
name: Шиповник собачий
latin: Rosa canina L.
family: rosaceae
status: draft
life_form: shrub
sourcing: [wild, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: Спелые ярко-красные плоды шиповника осенью
  - file: closeup.webp
    kind: closeup
    caption: Бледно-розовый цветок шиповника собачьего
  - file: raw.webp
    kind: raw
    caption: Сушёные измельчённые плоды шиповника с семенами
illustration: { file: illustration.webp, kind: plant }
summary: >-
  Колючий кустарник опушек и обочин с бледно-розовыми цветками и красными плодами. Настой плодов применяют в составе
  комплексного лечения при застое желчи; порошок плодов изучали при боли в суставах.
description: >-
  Раскидистый кустарник 2–3 м высотой с дуговидно свисающими ветвями, иногда цепляется за опору. Шипы одинаковые,
  крепкие, крючковатые. Листья из 7 листочков, обычно яйцевидных, голых, с пильчатым краем. Цветки по 2–10,
  3,5–4,5 см в диаметре, бледно-розовые. Плоды («ягоды» шиповника) ярко-алые, по форме очень разные — от шаровидных до
  удлинённых. Цветёт в июне, плоды созревают в октябре–ноябре (данные для Швейцарии).
habitats: [roadside, forest-edge, meadow]
harvest:
  - part: fruit
    months: [10, 11]
    how: >-
      По ГФ плоды собирают в период полного созревания, очищают от чашелистиков и плодоножек и сушат. Допускается не
      больше 5 % других частей шиповника (веточек, чашелистиков, плодоножек) и 1 % пригоревших или повреждённых плодов.
      Плоды шиповника собачьего созревают в октябре–ноябре (данные для Швейцарии), сроки зависят от региона.
      Собранное сразу кладут в чистую сухую тару, а не на землю (EMA GACP, раздел 11).
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; сырьё
      должно просыхать равномерно, иначе появится плесень. Конкретных температур в источниках нет. Готовое сырьё по ГФ —
      влажность не более 15 %.
    storage: >-
      Хранят в чистом, хорошо проветриваемом помещении, защищённом от насекомых и грызунов, от прямого и яркого
      рассеянного света, при относительной влажности воздуха не более 65 %. Готовый настой — не больше 2 суток в
      прохладном месте.
    sources:
      - {id: gf15-rosae-fructus-hypovitaminosus, page: "определение, испытания"}
      - {id: zhaw-rosa-canina}
      - {id: ema-gacp-2025, page: "11, 12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
      - {id: label-shipovnika-plody-nizkovitaminnye-krasnogorsk, page: "способ применения"}
substances: [organic-acids, flavonoids, carotenoids, tannins, pectins, ascorbic-acid]
actions: []
indications:
  - indication: biliary-dyskinesia
    evidence:
      level: traditional
      note: >-
        Зарегистрированная в России инструкция (ЛП-004642): комплексная терапия дискинезии желчевыводящих путей по
        гипомоторному типу, хронического гепатита, гепатохолецистита и некалькулёзного холецистита. Клинических
        исследований в инструкции нет — официальное показание без клинических данных.
    sources:
      - {id: label-shipovnika-plody-nizkovitaminnye-krasnogorsk, page: "показания"}
  - indication: osteoarthritis-pain
    evidence:
      level: proven
      note: >-
        Метаанализ 2008 г. (3 РКИ, 287 пациентов): специальный порошок плодов шиповника собачьего уменьшал боль при
        остеоартрозе сильнее плацебо, эффект небольшой–умеренный. Все три исследования поддержаны производителем
        порошка, данных мало — нужны независимые испытания. Речь о готовом порошке, а не о чае или настое.
    sources:
      - {id: christensen-2008-rosehip-oa}
usage:
  - form: infusion
    recipe: >-
      Около 10 г (1 столовая ложка) плодов залить 200 мл горячей кипячёной воды, держать на кипящей водяной бане 15
      минут, помешивая, охладить 45 минут, процедить, отжать и долить кипячёной водой до 200 мл. Перед приёмом
      взбалтывать.
    dosage: Взрослым — по 1/2 стакана (100 мл) 2–3 раза в день за 30 минут до еды, в тёплом виде.
    course: Курс 2–3 недели; дольше или повторно — по рекомендации врача.
    for_indications: [biliary-dyskinesia]
    sources:
      - {id: label-shipovnika-plody-nizkovitaminnye-krasnogorsk, page: "способ применения и дозы"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 12
  toxicity: none
  contraindications:
    - "Желчнокаменная болезнь (холелитиаз) — применять нельзя (инструкция ЛП-004642)."
    - "Повышенная чувствительность к шиповнику — применять нельзя (инструкция ЛП-004642)."
    - "Детям до 12 лет — противопоказано (инструкция ЛП-004642)."
  warnings:
    - "Беременность и кормление: применять, только если ожидаемая польза для матери выше риска для ребёнка, и после консультации врача (инструкция ЛП-004642)."
  side_effects:
    - "Возможны аллергические реакции (инструкция ЛП-004642)."
  interactions:
    - "Взаимодействий с лекарствами не описано (инструкция ЛП-004642)."
  sources:
    - {id: label-shipovnika-plody-nizkovitaminnye-krasnogorsk, page: "противопоказания, беременность, побочное действие, взаимодействие"}
sources:
