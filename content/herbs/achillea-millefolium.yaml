id: achillea-millefolium
name: Тысячелистник обыкновенный
other_names: ["кровавник", "порезник", "деревей", "солдатская трава", "белоголовник"]
latin: Achillea millefolium L.
family: asteraceae
status: draft
life_form: herb
sourcing: [wild, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: "Цветущий тысячелистник: сложные щитки из мелких белых корзинок, узкие мелко рассечённые листья"
  - file: closeup.webp
    kind: closeup
    caption: "Листья крупным планом: перисторассечённые на множество узких долей (отсюда название «тысячелистник»)"
  - file: raw.webp
    kind: raw
    caption: Сухая измельчённая трава — кусочки стеблей и листьев, мелкие продолговатые корзинки (линейка — 1 см)
description: >-
  Многолетнее травянистое растение высотой обычно 20–60 см (до 120 см) с тонким ползучим корневищем; всё растение более
  или менее покрыто тонкими белыми волосками. Стебли прямые, округлые, тонкобороздчатые. Листья ланцетные, дважды-трижды
  перисторассечённые на множество узких долей — отсюда название «тысячелистник». Мелкие продолговато-яйцевидные корзинки
  длиной 3–4 мм собраны в сложные щитки: краевые язычковые цветки белые, реже розовые, срединные трубчатые — жёлтые или
  серовато-жёлтые. Запах слабый, характерный. Цветёт в июле–октябре. Есть ядовитые двойники — болиголов и вех (см. «С чем
  можно спутать»).
habitats: [meadow, field, roadside, wasteland]
harvest:
  - part: herb
    months: [7, 8, 9, 10]
    how: >-
      Собирают траву в фазу цветения: сырьё — цельные или частично измельчённые цветоносные побеги (по ГФ стебли в сырье
      длиной до 15 см, листья до 10 см). В цельном сырье допускается не более 3 % стеблей толще 3 мм, не более 1 %
      потемневших и почерневших частей, не более 1,5 % органической и не более 1 % минеральной примеси. Собирать лучше в
      сухую погоду, не по росе и не после дождя; срезанное сразу кладут в чистую сухую тару, а не на землю (EMA GACP,
      раздел 11). Тот же раздел требует, чтобы в собранное сырьё по возможности не попадали ядовитые сорные растения, а у
      тысячелистника есть ядовитые двойники — болиголов пятнистый и вех ядовитый (см. «С чем можно спутать»). Цветёт в июле–октябре
      («Флора СССР», т. XXVI, по данным Плантариума); более узких сроков сбора в источниках нет.
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; на земле
      сушить нельзя, а под прямым солнцем — только если это не вредит качеству. До сушки сырьё не следует держать под
      прямым солнцем, его нужно защищать от дождя. Сырьё должно просыхать равномерно, иначе появится плесень.
      Температуру и время выбирают с учётом части растения (трава) и состава действующих веществ, например эфирного
      масла; конкретных цифр в источниках для тысячелистника нет. Готовое сырьё по ГФ — влажность не более 13 %.
    storage: >-
      Хранят в чистом, хорошо проветриваемом помещении, защищённом от насекомых и грызунов, от прямого и яркого
      рассеянного света, при относительной влажности воздуха не более 65 %; воздух должен свободно циркулировать.
      Запасы ежегодно перебирают и проверяют на вредителей и на соответствие сроку годности. Срок годности для
      тысячелистника в ГФ не указан.
    sources:
      - {id: gf15-achilleae-millefolii-herba, page: "определение, внешние признаки, испытания"}
      - {id: plantarium-achillea-millefolium, page: "Ботаническое описание (Флора СССР, т. XXVI: «Цв. VII—X»)"}
      - {id: ema-gacp-2025, page: "11, 12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
substances: [essential-oil, flavonoids]
actions: [antispasmodic, choleretic, anti-inflammatory, hemostatic]
indications:
  - indication: appetite-loss
    evidence:
      level: traditional
      note: >-
        EMA (2020): традиционное применение — временная потеря аппетита (чай из измельчённой травы); основано только на
        многолетнем опыте, клинических данных монография не приводит.
    sources:
      - {id: ema-millefolii-herba, page: "4.1, 4.2"}
  - indication: gi-minor-complaints
    evidence:
      level: traditional
      note: >-
        EMA (2020): традиционное применение — симптоматическое лечение лёгких спастических жалоб со стороны
        желудочно-кишечного тракта, включая вздутие и метеоризм; основано только на многолетнем опыте. Обзоры 2007 и
        2017 гг. по их аннотациям описывают традиционное применение и лабораторные данные (в том числе об антиспастическом
        действии флавоноидов), но не клинические испытания, поэтому уровень остаётся «традиционное».
    sources:
      - {id: ema-millefolii-herba, page: "4.1, 4.2"}
      - {id: benedek-kopp-2007-yarrow}
      - {id: ali-2017-yarrow-review}
  - indication: menstrual-cramps
    evidence:
      level: traditional
      note: >-
        EMA (2020): традиционное применение — симптоматическое лечение лёгких спазмов при менструации (чай из
        измельчённой травы); основано только на многолетнем опыте. Одно двойное слепое РКИ 2015 г. (Иран, чай из
        тысячелистника против плацебо, 3 дня в течение 2 циклов) показало, что боль снижается сильнее, чем в группе
        плацебо; но это одно испытание (размер выборки в аннотации не указан), а обзора или монографии с хорошо
        изученным применением нет, поэтому уровень остаётся «традиционное».
    sources:
      - {id: ema-millefolii-herba, page: "4.1, 4.2"}
      - {id: jenabi-2015-yarrow-dysmenorrhea}
  - indication: skin-minor-inflammation
    evidence:
      level: traditional
      note: >-
        EMA (2020): традиционное применение — лечение мелких поверхностных ран (наружно, пропитанные настоем повязки);
        основано только на многолетнем опыте. В монографии речь только о ранах, воспаление кожи в показании не названо.
        БРЭ называет тысячелистник кровоостанавливающим и противовоспалительным средством, обзор 2017 г. — применяемым
        для заживления ран, но клинических данных это не даёт.
    sources:
      - {id: ema-millefolii-herba, page: "4.1, 4.2"}
      - {id: bre-tysiachelistnik}
      - {id: ali-2017-yarrow-review}
usage:
  - form: tea
    recipe: >-
      Залить 1,5–4 г измельчённой травы 150–250 мл кипятка, заварить как травяной настой и процедить (время настаивания
      в монографии не указано).
    dosage: >-
      3–4 раза в день между приёмами пищи. Подросткам, взрослым и пожилым; детям до 12 лет не рекомендуется (данных
      недостаточно).
    course: Если симптомы держатся дольше 2 недель — обратиться к врачу или квалифицированному специалисту.
    for_indications: [appetite-loss, gi-minor-complaints]
    sources:
      - {id: ema-millefolii-herba, page: "4.2, 4.4"}
  - form: tea
    recipe: >-
      Залить 1–2 г измельчённой травы 250 мл кипятка, заварить как травяной настой и процедить (время настаивания в
      монографии не указано).
    dosage: >-
      2–3 раза в день. Подросткам, взрослым и пожилым; детям до 12 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше недели — обратиться к врачу или квалифицированному специалисту.
    for_indications: [menstrual-cramps]
    sources:
      - {id: ema-millefolii-herba, page: "4.2, 4.4"}
  - form: compress
    recipe: >-
      Залить 3–4 г измельчённой травы 250 мл кипятка (время настаивания в монографии не указано). Настоем пропитывают
      повязку и накладывают её на поражённое место.
    dosage: >-
      2–3 раза в день. Подросткам, взрослым и пожилым; детям до 12 лет не рекомендуется (данных недостаточно).
    course: >-
      Если симптомы держатся дольше недели — обратиться к врачу или квалифицированному специалисту; при признаках
      инфекции кожи — обратиться за медицинской помощью.
    for_indications: [skin-minor-inflammation]
    sources:
      - {id: ema-millefolii-herba, page: "4.2, 4.4"}
  - form: other
    recipe: >-
      Домашнего рецепта нет — это готовые аптечные препараты, которые перечисляет монография: сок из свежей травы;
      жидкий экстракт (соотношение 1:1, этанол 25 %); настойки на этаноле 45 % и 31,5 % (1 часть сырья на 5 частей
      экстрагента); сухие экстракты на воде.
    dosage: >-
      При потере аппетита и спастических жалобах ЖКТ: сок 5–10 мл 2–3 раза в день; жидкий экстракт 2–4 мл 3 раза в
      день; настойка (этанол 45 %) 2–4 мл 3 раза в день; настойка (этанол 31,5 %) 4,3 мл (= 4,2 г) 4 раза в день;
      при потере аппетита жидкие формы принимают за 30 минут до еды. Только при спастических жалобах ЖКТ: сухой
      экстракт (6–9:1) 334 мг 3–4 раза в день. При менструальных спазмах: сухой экстракт (5–10:1) 250 мг 2–3 раза в
      день. Подросткам, взрослым и пожилым; детям до 12 лет не рекомендуется (данных недостаточно).
    course: >-
      При потере аппетита и жалобах ЖКТ — если симптомы держатся дольше 2 недель, при менструальных спазмах — дольше
      недели, обратиться к врачу или квалифицированному специалисту.
    for_indications: [appetite-loss, gi-minor-complaints, menstrual-cramps]
    sources:
      - {id: ema-millefolii-herba, page: "2, 4.2"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 12
  toxicity: none
  contraindications:
    - "Аллергия (повышенная чувствительность) на тысячелистник и на другие растения семейства астровых (сложноцветных) — применять нельзя (EMA 4.3)."
  warnings:
    - "Дети до 12 лет: безопасность не установлена из-за нехватки данных — применение не рекомендуется (EMA 4.2, 4.4)."
    - "Беременность и кормление: безопасность не установлена; из-за нехватки данных применять не рекомендуется. Данных о влиянии на фертильность нет (EMA 4.6)."
    - "Если при приёме внутрь симптомы ухудшаются — обратиться к врачу или квалифицированному специалисту. При наружном применении, если появились признаки инфекции кожи, — обратиться за медицинской помощью (EMA 4.4)."
    - "Если симптомы держатся дольше 2 недель (потеря аппетита, жалобы ЖКТ) или дольше недели (менструальные спазмы, раны), обратиться к врачу или квалифицированному специалисту (EMA 4.2)."
    - "Адекватные исследования влияния на способность управлять транспортом не проводились (EMA 4.7)."
    - "Доклинические данные: сухой водный экстракт не вызывал мутаций в тесте Эймса (это относится к сухому экстракту, не к домашнему чаю); тесты на репродуктивную токсичность и канцерогенность не проводились (EMA 5.3)."
    - "Сборщику: у тысячелистника есть ядовитые двойники — болиголов пятнистый и вех ядовитый. EMA GACP (раздел 11) требует, чтобы ядовитые сорные растения по возможности не попадали в собранное сырьё. Признаки — в разделе «С чем можно спутать»."
  side_effects:
    - "Описаны кожные реакции гиперчувствительности; частота неизвестна (EMA 4.8)."
    - "Если возникают другие нежелательные реакции — обратиться к врачу или квалифицированному специалисту (EMA 4.8)."
    - "Случаев передозировки не описано (EMA 4.9)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - {id: ema-millefolii-herba, page: "4.2–4.9, 5.3"}
    - {id: ema-gacp-2025, page: "11"}
lookalikes:
  - name: Болиголов пятнистый
    latin: Conium maculatum L.
    poisonous: true
    differences: >-
      ЯДОВИТ. Один из самых ядовитых видов высших растений: алкалоиды (кониин и др.) есть во всех органах, отравление
      поражает нервную систему и может закончиться смертью (обзор Vetter, 2004). Отличия по «Флоре СССР»: болиголов —
      двулетник 60–180 см, стебель и листья голые; стебель иногда с сизым налётом и красновато-бурыми пятнами в нижней
      части (см. фото) — но пятна бывают не всегда, поэтому по их отсутствию судить о безопасности растения нельзя.
      Листья болиголова трижды перистые, широко треугольные, 30–60 см длиной, соцветия — зонтики, цветёт в июне–июле.
      У тысячелистника — многолетник, всё растение более или менее опушено тонкими белыми волосками, листья ланцетные,
      дважды-трижды перисторассечённые на мелкие доли, цветки в корзинках, собранных в сложные щитки, цветёт в
      июле–октябре.
    photo:
      file: twin-conium-maculatum.webp
      kind: closeup
      caption: Стебель болиголова пятнистого — тонко бороздчатый, голый, с красновато-бурыми пятнами
  - name: Вех ядовитый
    latin: Cicuta virosa L.
    poisonous: true
    differences: >-
      ЯДОВИТ. Всё растение сильно токсично; главный яд — цикутоксин и родственные полиацетилены, они блокируют ГАМК-систему
      мозга, отравление развивается быстро и может закончиться смертью; по обзору 2020 г., это одно из двух самых
      ядовитых растений флоры Великобритании. Растёт по заболоченным берегам рек и озёр, на болотах и сырых лугах, тогда
      как тысячелистник — на суходольных лугах, залежах и у дорог («Флора СССР»). Характерный признак веха — толстый
      вертикальный стеблекорень, разделённый поперечными перегородками на камеры (в камерах жёлтоватая маслянистая
      жидкость), и полые стебли (см. фото разреза); у тысячелистника корневище тонкое ползучее. Листья веха дважды (реже
      трижды) перисторассечённые, пластинки 15–30 см, конечные доли ланцетные, 3–8 см длиной и 0,5–2 см шириной, по
      краю остропильчатые; у тысячелистника доли и зубцы листа длиной всего 0,5–1,5 мм. Соцветия веха — шаровидные
      зонтики с белыми лепестками, цветёт в июле–августе.
    photo:
      file: twin-cicuta-virosa.webp
      kind: closeup
      caption: Продольный разрез стеблекорня веха ядовитого — полость разделена поперечной перегородкой
