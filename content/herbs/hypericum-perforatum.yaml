id: hypericum-perforatum
name: Зверобой продырявленный
other_names: ["зверобой исколотый", "дырявник", "богородичная трава"]
latin: Hypericum perforatum L.
family: hypericaceae
status: draft
life_form: herb
sourcing: [wild, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: Цветущий зверобой продырявленный на лугу
  - file: closeup.webp
    kind: closeup
    caption: "Супротивные листья: на просвет видны светлые точки-вместилища"
illustration: { file: illustration.webp, kind: plant }
description: >-
  Многолетник до 100 см высотой с прямым полым стеблем, на котором видны две продольные грани-рёбра. Листья супротивные,
  сидячие, продолговато-овальные, цельнокрайние; если посмотреть лист на свет, видны многочисленные светлые точки —
  вместилища (отсюда название «продырявленный»). Жёлтые пятилепестные цветки диаметром 1–1,5 см собраны в щитковидную
  метёлку, под лупой на лепестках заметны тёмные точки; плод — трёхгнёздная коробочка. Запах слабый, характерный, водное извлечение
  горьковатое и слегка вяжущее. Цветёт в июне–августе (данные для Средней Европы).
habitats: [meadow, forest-edge, roadside, wasteland]
harvest:
  - part: herb
    months: [6, 7, 8]
    how: >-
      Срезают верхушки побегов в фазу цветения: сырьё — верхние части стеблей (длиной до 50 см) с листьями, цветками,
      бутонами и недозрелыми плодами. По ГФ в сырье допускается не более 50 % стеблей, не более 3 % потемневших и
      почерневших частей, не более 1 % органической и не более 1 % минеральной примеси. Собирать лучше в сухую погоду,
      не по росе и не после дождя; срезанное сразу кладут в чистую сухую тару, а не на землю (EMA GACP, раздел 11).
      Цветёт в июне–августе — данные для Средней Европы (лист Байройтского университета). Внимательно отличайте от
      зверобоя пятнистого: ГФ допускает оба вида, а данные EMA относятся только к зверобою продырявленному (см. «С чем можно спутать»).
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; на земле
      сушить нельзя, а под прямым солнцем — только если это не вредит качеству. До сушки сырьё не следует держать под прямым
      солнцем, его нужно защищать от дождя. Сырьё должно просыхать равномерно, иначе появится плесень. Температуру и время выбирают с
      учётом части растения и состава действующих веществ; конкретных цифр в источниках для зверобоя нет. Готовое сырьё
      по ГФ — влажность не более 13 %.
    storage: >-
      Хранят в чистом, хорошо проветриваемом помещении, защищённом от насекомых и грызунов, от прямого и яркого
      рассеянного света, при относительной влажности воздуха не более 65 %; воздух должен свободно циркулировать.
      Запасы ежегодно перебирают и проверяют на вредителей и на соответствие сроку годности. Срок годности для зверобоя
      в ГФ не указан.
    sources:
      - {id: gf14-hyperici-herba, page: "определение, подлинность, испытания"}
      - {id: bayreuth-artenkenntnis-hypericum-perforatum, page: "Merkmale (период цветения)"}
      - {id: ema-gacp-2025, page: "11, 12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
substances: [hypericin, hyperforin, flavonoids, tannins]
actions: [antidepressant]
indications:
  - indication: depression-mild-moderate
    evidence:
      level: proven
      note: >-
        EMA (2022): хорошо изученное применение — лёгкие и умеренные депрессивные эпизоды (сухие экстракты а и b) и
        краткосрочное лечение лёгких депрессивных расстройств (экстракт c); метаанализ 2017 г. (27 исследований, 3808
        пациентов): при лёгкой и умеренной депрессии зверобой сопоставим с СИОЗС. Уровень «доказано» относится только
        к сухим экстрактам, названным в монографии (экстракция метанолом 80 %, этанолом 80 % или этанолом 50–68 %), и
        НЕ относится к домашнему чаю или настою: в разделе о хорошо изученном применении для травы как сырья стоит «не
        применимо», а для чая монография признаёт лишь традиционные показания (см. ниже). По оценочному отчёту EMA, показание
        «депрессия» в традиционной медицине неизвестно: зверобой применяли, чтобы «укреплять нервы» (2.3).
    sources:
      - {id: ema-hyperici-herba, page: "2, 4.1"}
      - {id: ng-2017-sjw-depression}
      - {id: ema-ar-hyperici-herba, page: "2.3, 6"}
  - indication: mental-exhaustion
    evidence:
      level: traditional
      note: >-
        EMA (2022): традиционное применение — облегчение временного умственного истощения (чай из измельчённой травы);
        основано только на многолетнем опыте, клинических данных для чая монография не приводит.
    sources:
      - {id: ema-hyperici-herba, page: "4.1, 4.2"}
      - {id: ema-ar-hyperici-herba, page: "2.3"}
  - indication: nervous-restlessness-sleep
    evidence:
      level: traditional
      note: >-
        EMA (2022): традиционное применение — поддерживающее средство при нервном беспокойстве и трудностях с
        засыпанием (чай из измельчённой травы); основано только на многолетнем опыте.
    sources:
      - {id: ema-hyperici-herba, page: "4.1, 4.2"}
  - indication: gi-mild-discomfort
    evidence:
      level: traditional
      note: >-
        EMA (2022): традиционное применение — облегчение лёгкого дискомфорта в желудочно-кишечном тракте (чай из
        измельчённой травы); основано только на многолетнем опыте.
    sources:
      - {id: ema-hyperici-herba, page: "4.1, 4.2"}
  - indication: skin-minor-inflammation
    evidence:
      level: traditional
      note: >-
        EMA (2022): традиционное применение — симптоматическое лечение лёгких воспалений кожи (например, солнечного
        ожога) и вспомогательное средство при заживлении мелких ран; наружно, в виде обмываний и пропитанных повязок из
        настоя; основано только на многолетнем опыте.
    sources:
      - {id: ema-hyperici-herba, page: "4.1, 4.2"}
usage:
  - form: tea
    recipe: >-
      Залить 1,5–2 г измельчённой травы 150 мл кипятка, заварить как травяной настой и процедить (время настаивания в
      монографии не указано).
    dosage: >-
      2–3 раза в день, суточная доза 3–6 г травы. Взрослым и пожилым; детям и подросткам до 18 лет не рекомендуется
      (данных недостаточно).
    course: Если симптомы держатся дольше 2 недель — обратиться к врачу или квалифицированному специалисту.
    for_indications: [mental-exhaustion]
    sources:
      - {id: ema-hyperici-herba, page: "4.2, 4.4"}
  - form: tea
    recipe: >-
      Залить 2–3 г измельчённой травы 150 мл кипятка, заварить как травяной настой и процедить (время настаивания в
      монографии не указано).
    dosage: >-
      2 раза в день. Взрослым и пожилым; детям и подросткам до 18 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше 2 недель — обратиться к врачу или квалифицированному специалисту.
    for_indications: [nervous-restlessness-sleep]
    sources:
      - {id: ema-hyperici-herba, page: "4.2, 4.4"}
  - form: tea
    recipe: >-
      Залить 2 г измельчённой травы 150 мл кипятка, заварить как травяной настой и процедить (время настаивания в
      монографии не указано).
    dosage: >-
      2 раза в день. Взрослым и пожилым; детям и подросткам до 18 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше недели — обратиться к врачу или квалифицированному специалисту.
    for_indications: [gi-mild-discomfort]
    sources:
      - {id: ema-hyperici-herba, page: "4.2, 4.4"}
  - form: compress
    recipe: >-
      Настой для наружного применения: 2 г измельчённой травы на 150 мл воды (температура воды и время настаивания в
      монографии не указаны). Настоем обмывают кожу или пропитывают им повязки.
    dosage: >-
      Несколько раз в день. Подросткам, взрослым и пожилым; детям младше 12 лет не рекомендуется (данных о безопасности
      нет). Пока лечите кожу, обработанные участки нельзя подвергать интенсивному ультрафиолету.
    course: Если симптомы держатся дольше недели — обратиться к врачу или квалифицированному специалисту.
    for_indications: [skin-minor-inflammation]
    sources:
      - {id: ema-hyperici-herba, page: "4.2, 4.4"}
  - form: other
    recipe: >-
      Домашнего рецепта нет. Показание относится только к готовым лекарственным препаратам в твёрдых формах для приёма
      внутрь с сухим экстрактом из монографии: (а) экстракция метанолом 80 %, соотношение сырья и экстракта 3–7:1;
      (b) этанолом 80 %, 3–6:1; (c) этанолом 50–68 %, 2,5–8:1. Для травы как сырья в этом разделе монографии стоит «не
      применимо». Препарат и дозу выбирает врач, ориентируйтесь на инструкцию.
    dosage: >-
      По монографии: экстракт (а) — 300–600 мг 1–3 раза в день (600–1800 мг в сутки); (b) — 900 мг один раз в день;
      (c) — 600 или 612 мг один раз в день либо 250–600 мг 2–3 раза в день (500–1200 мг в сутки). Детям и подросткам до
      18 лет не рекомендуется (данных недостаточно).
    course: >-
      Начало действия можно ожидать в течение 4 недель; для лёгких депрессивных расстройств (экстракт c) — краткосрочное лечение, 6
      недель. Если симптомы сохраняются — обратиться к врачу.
    for_indications: [depression-mild-moderate]
    sources:
      - {id: ema-hyperici-herba, page: "2, 3, 4.2"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 18
  toxicity: low
  contraindications:
    - "Аллергия (повышенная чувствительность) на зверобой — применять нельзя (EMA 4.3)."
    - "Кумариновые антикоагулянты (в оценочном отчёте EMA названы аценокумарол, фенпрокумон, варфарин) — одновременный приём противопоказан (EMA 4.3)."
    - "Циклоспорин — одновременный приём противопоказан (EMA 4.3)."
    - "Эверолимус — одновременный приём противопоказан (EMA 4.3)."
    - "Сиролимус — одновременный приём противопоказан (EMA 4.3)."
    - "Такролимус системного действия — одновременный приём противопоказан (EMA 4.3)."
    - "Фосампренавир, индинавир и другие ингибиторы протеазы (препараты от ВИЧ) — одновременный приём противопоказан (EMA 4.3)."
    - "Нуклеозидные ингибиторы обратной транскриптазы (препараты от ВИЧ; в оценочном отчёте EMA в этой группе названы, например, эфавиренз, этравирин, невирапин) — одновременный приём противопоказан (EMA 4.3)."
    - "Иринотекан — одновременный приём противопоказан (EMA 4.3)."
    - "Иматиниб и другие цитостатики, которые перерабатываются ферментами CYP3A4, CYP2B6, CYP2C9, CYP2C19 или выводятся P-гликопротеином, — одновременный приём противопоказан (EMA 4.3)."
  warnings:
    - "Монография EMA делит традиционные препараты зверобоя по суточной дозе гиперфорина: при дозе не более 1 мг в 4.3 остаётся только гиперчувствительность, а при дозе больше 1 мг действует весь список лекарств выше (EMA 4.3, 4.5). К какой группе относится домашний чай, монография не говорит. В оценочном отчёте EMA сказано, что в травяной чай переходит лишь около 1 % гиперфорина из сырья (1.1), но описан и случай заметного падения уровня циклоспорина у пациента после пересадки почки, начавшего регулярно пить чай-смесь со зверобоем (5.5.4, таблица 16). Поэтому в карточке приняты все ограничения, как для большой дозы: перед чаем со зверобоем сверьтесь с врачом или фармацевтом, особенно если принимаете любые лекарства."
    - "Во время лечения избегать интенсивного ультрафиолета (солнечного и других источников); при наружном применении — не подвергать ему обработанные участки кожи (EMA 4.4)."
    - "Детям и подросткам до 18 лет внутрь не рекомендуется из-за нехватки данных, при наружном применении — детям до 12 лет (EMA 4.4)."
    - "Беременность и кормление: безопасность не установлена, в опытах на животных есть признаки репродуктивной токсичности; применять не рекомендуется. Данных о влиянии на фертильность нет (EMA 4.6). Оценочный отчёт EMA беременность прямым противопоказанием не считает, так как данные недостаточно убедительны (5.5.2)."
    - "Если на коже появились признаки инфекции — обратиться к врачу или квалифицированному специалисту (EMA 4.4)."
    - "Если симптомы (истощение, беспокойство, трудности с засыпанием) держатся дольше 2 недель, а при кожных проявлениях и дискомфорте в животе — дольше недели, обратиться к врачу или квалифицированному специалисту (EMA 4.2)."
    - "Адекватных исследований влияния на способность управлять транспортом не проводилось (EMA 4.7)."
    - "Передозировка: после приёма до 4,5 г сухого экстракта в сутки в течение 2 недель и ещё 15 г перед госпитализацией описаны судороги и спутанность сознания. После очень больших доз нужно 1–2 недели защищаться от солнца и других источников УФ (EMA 4.9)."
  side_effects:
    - "Возможны тошнота, боль в животе и диарея, аллергические реакции кожи, усталость и беспокойство; частота неизвестна (EMA 4.8)."
    - "У светлокожих людей при интенсивном солнце возможны нарушения чувствительности (покалывание, чувствительность к холоду или боль, жжение) и усиленные солнечные ожоги (EMA 4.8)."
    - "При наружном применении возможны кожные реакции; частота неизвестна (EMA 4.8)."
    - "Приём 1800 мг экстракта в сутки в течение 15 дней повышал чувствительность кожи к УФА; при рекомендуемых дозах признаков фототоксичности не описано (EMA 5.3)."
  interactions:
    - "Пациентам, которые принимают рецептурные лекарства, перед приёмом зверобоя советуют проконсультироваться с врачом или фармацевтом (EMA 4.5)."
    - "Как это работает: препараты зверобоя усиливают активность ферментов CYP3A4, CYP2B6, CYP2C9, CYP2C19 и белка-переносчика P-гликопротеина, поэтому другие лекарства быстрее выводятся и их концентрация в крови может снижаться; повышенная активность ферментов возвращается к норме в течение недели после отмены (EMA 4.5)."
    - "Противопоказан одновременный приём с кумариновыми антикоагулянтами, циклоспорином, эверолимусом, сиролимусом, такролимусом системного действия, фосампренавиром, индинавиром и другими ингибиторами протеазы, нуклеозидными ингибиторами обратной транскриптазы, иринотеканом, иматинибом и другими цитостатиками, которые перерабатываются CYP3A4, CYP2B6, CYP2C9, CYP2C19 или выводятся P-гликопротеином (EMA 4.5; подробно — в «Противопоказаниях»)."
    - "Амитриптилин: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Фексофенадин: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Алпразолам: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Диазепам: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Мидазолам: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Метадон: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Симвастатин: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Дигоксин: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Финастерид: осторожность, возможно снижение его концентрации в крови (EMA 4.5)."
    - "Все остальные лекарства, обмен которых зависит от CYP3A4, CYP2B6, CYP2C9, CYP2C19 или P-гликопротеина, — тоже с осторожностью (EMA 4.5). Список, на который монография ссылается как на ориентир (оценочный отчёт EMA 5.5.4), называет среди прочих: эритромицин; противоэпилептические фенитоин, фенобарбитал и мефенитоин; итраконазол и вориконазол; антипсихотики клозапин, кветиапин, рисперидон, зипрасидон; амлодипин, дилтиазем, никардипин, нифедипин, верапамил; карведилол и пропранолол; фентанил, оксикодон, трамадол; клопидогрел; омепразол и другие ингибиторы протонной помпы; аторвастатин; доцетаксел и паклитаксел; кетамин; ивабрадин; эзопиклон и золпидем; гликлазид; бупропион и кломипрамин; макитентан."
    - "Гормональные контрацептивы: снижение их концентрации может вызвать межменструальные кровотечения и ослабить надёжность контрацепции, поэтому женщинам нужны дополнительные меры предохранения (EMA 4.5). Систематический обзор 2016 г.: данные ограничены, но есть признаки риска овуляции и прорывных кровотечений; единственное исследование без изменений использовало препарат с малым содержанием гиперицина."
    - "Перед плановой операцией нужно заранее выяснить возможные взаимодействия с препаратами для общей и регионарной анестезии; при необходимости зверобой отменяют (EMA 4.5)."
    - "Антидепрессанты — ингибиторы обратного захвата серотонина (например, сертралин, пароксетин): возможно усиление серотонинергических эффектов (EMA 4.5)."
    - "Буспирон: возможно усиление серотонинергических эффектов (EMA 4.5)."
    - "Серотониновый синдром (очень редко) при сочетании с ингибиторами обратного захвата серотонина и другими серотонинергическими веществами: потливость, учащённое сердцебиение, диарея, лихорадка; возбуждение, дезориентация; тремор, миоклонии (EMA 4.5). Оценочный отчёт EMA (5.5.4) к веществам, у которых возможно такое взаимодействие, относит также циталопрам, дулоксетин, эсциталопрам, флуоксетин, флувоксамин, миртазапин, моклобемид, тразодон, венлафаксин и трамадол."
    - "Для традиционных препаратов с суточной дозой гиперфорина не более 1 мг и применением не дольше 2 недель клинически значимых взаимодействий с лекарствами, перерабатываемыми CYP1A2, CYP2B6, CYP2C9, CYP2C19, CYP3A4 или P-гликопротеином, не описано; с лекарствами, перерабатываемыми другими ферментами CYP, взаимодействия не изучались (EMA 4.5). Относится ли это к домашнему чаю, монография не говорит."
    - "При наружном применении (обмывания, повязки) взаимодействий не описано (EMA 4.5)."
    - "Оценочный отчёт EMA (5.5.4, таблица 16) описывает случай: у пациента после пересадки почки уровень циклоспорина в крови значительно упал, когда он начал регулярно пить травяной чай-смесь со зверобоем; после отмены чая уровень вернулся к обычному."
