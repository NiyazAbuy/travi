lookalikes:
  - name: Зверобой пятнистый (зверобой четырёхгранный)
    latin: Hypericum maculatum Crantz
    poisonous: false
    differences: >-
      Очень похож и растёт в тех же местах. Смотрите на стебель: у зверобоя продырявленного он с двумя продольными
      рёбрами, у пятнистого — с четырьмя (ГФ; то же в листе Байройтского университета, где у пятнистого к тому же
      плоский край листа, а у продырявленного он часто загнут вниз). Листья продырявленного на просвет усеяны светлыми
      точками-вместилищами — в ГФ это названо признаком именно этого вида. Чашелистики у продырявленного ланцетовидные,
      тонко заострённые, у пятнистого — продолговато-овальные (ГФ). Важно не путать: ГФ допускает в сырьё оба вида,
      но монография EMA, на которой основана эта карточка, написана только про зверобой продырявленный.
    photo:
      file: twin-hypericum-maculatum.webp
      kind: plant
      caption: Побег зверобоя пятнистого со стеблем и листьями (для сравнения)
