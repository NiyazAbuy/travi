id: mentha-piperita
name: Мята перечная
latin: Mentha × piperita L.
family: lamiaceae
status: draft
life_form: herb
sourcing: [garden, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: Мята перечная на грядке
  - file: closeup.webp
    kind: closeup
    caption: Побеги с пильчатыми листьями
  - file: raw.webp
    kind: raw
    caption: Сухие листья мяты перечной
illustration: { file: illustration.webp, kind: plant }
description: >-
  Многолетнее сильно ароматное травянистое растение до 90 см высотой. Это естественный гибрид водной мяты
  (Mentha aquatica) и колосистой мяты (Mentha spicata); из-за такого происхождения он самостерилен, поэтому мяту разводят
  вегетативно — делением корневищ и укоренением побегов. Край листа пильчатый с неровными острыми зубцами; на
  пластинке видны блестящие золотисто-жёлтые железки с эфирным маслом, а снизу по жилкам — прижатые беловатые волоски.
  Мелкие цветки собраны в мутовки в верхушечных соцветиях, цветёт мята в июле–августе. Запах сильный, характерный, а
  настой на вкус жгучий и холодящий.
habitats: [garden]
harvest:
  - part: leaf
    months: [7, 8]
    how: >-
      Срезают побеги в фазу цветения (в июле–августе) и отделяют листья от стеблей: в сырье допускается не более 10 %
      стеблей. В промышленности траву для этого скашивают и обмолачивают. Потемневшие и почерневшие листья — брак
      (допускается не более 5 %).
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; на земле
      сушить нельзя, а под прямым солнцем — только если это не вредит качеству. Сырьё должно просыхать равномерно, иначе
      появится плесень. Температуру и время подбирают с учётом эфирного масла в листьях; конкретных цифр в источниках
      для мяты нет. Готовое сырьё по ГФ — влажность не более 14 %.
    storage: >-
      Хранят в сухом, чистом, проветриваемом месте, защищённом от света и насекомых, при относительной влажности
      воздуха не более 65 %. Сырьё с эфирным маслом и сильным запахом держат отдельно от другого, в хорошо закрытой таре.
      Запасы периодически перебирают и проверяют на вредителей (по ОФС — не реже раза в год). Срок годности для мяты
      в ГФ не указан.
    sources:
      - {id: gf14-menthae-piperitae-folia, page: "определение, подлинность, испытания"}
      - {id: shuvaeva-2009-mentol-mints, page: "результаты и обсуждение (период цветения)"}
      - {id: ema-gacp-2025, page: "12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
substances: [essential-oil, menthol, menthone, luteolin, rosmarinic-acid]
actions: [antispasmodic, carminative, choleretic]
indications:
  - indication: dyspepsia-flatulence
    evidence:
      level: traditional
      note: "EMA (2020, пересмотр 1): традиционное применение листа мяты перечной при расстройстве пищеварения и метеоризме; монография на эфирное масло — отдельный документ и здесь не используется."
    sources:
      - {id: ema-menthae-piperitae-folium, page: "4.1"}
      - {id: ema-ar-menthae-piperitae, page: "6"}
usage:
  - form: tea
    recipe: >-
      Залить сырьё 100–150 мл кипятка (взрослым 1,5–3 г, детям 4–11 лет и подросткам 1–2 г), заварить как травяной
      настой и процедить (время настаивания в монографии не указано).
    dosage: 3 раза в день. Детям младше 4 лет не рекомендуется (данных недостаточно).
    course: Если симптомы держатся дольше 2 недель — обратиться к врачу.
    for_indications: [dyspepsia-flatulence]
    sources:
      - {id: ema-menthae-piperitae-folium, page: "4.2, 4.4"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 4
  toxicity: none
  contraindications:
    - "Аллергия на препараты из листа мяты перечной и на ментол — применять нельзя (EMA 4.3)."
    - "Изжога и гастроэзофагеальный рефлюкс (ГЭРБ): от мяты лучше отказаться, изжога может усилиться; то же при грыже пищеводного отверстия диафрагмы (EMA 4.4; оценочный отчёт 5.3)."
  warnings:
    - "Желчнокаменная болезнь, холангит и другие заболевания желчных путей — только с осторожностью и под наблюдением врача: мята может усиливать выработку желчи (EMA 4.4; оценочный отчёт 5.3)."
    - "Беременность и кормление: безопасность не установлена, из-за нехватки данных применять не рекомендуется (EMA 4.6)."
    - "Если симптомы ухудшаются или держатся дольше 2 недель — обратиться к врачу (EMA 4.2, 4.4)."
  side_effects:
    - "Может усилиться рефлюкс и изжога; частота неизвестна (EMA 4.8)."
    - "О серьёзных нежелательных эффектах при обычном и длительном употреблении мятного чая не сообщалось (оценочный отчёт EMA 5.3)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - {id: ema-menthae-piperitae-folium, page: "4.2–4.8"}
    - {id: ema-ar-menthae-piperitae, page: "5.3"}
sources:
  - {id: ema-ar-menthae-piperitae, page: "1.1"}
  - {id: bre-myata}
  - {id: shuvaeva-2009-mentol-mints, page: "введение"}
