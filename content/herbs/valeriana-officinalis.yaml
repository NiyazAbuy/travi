id: valeriana-officinalis
name: Валериана лекарственная
latin: Valeriana officinalis L.
family: caprifoliaceae
status: draft
life_form: herb
sourcing: [wild, garden, pharmacy]
photos:
  - file: plant.webp
    kind: plant
    caption: Цветущая валериана — зонтиковидные соцветия из мелких розоватых цветков
  - file: closeup.webp
    kind: closeup
    caption: Соцветие валерианы с белыми цветками на лугу
  - file: raw.webp
    kind: raw
    caption: Высушенные корневища с корнями валерианы
illustration: { file: illustration.webp, kind: plant }
summary: >-
  Высокий многолетник сырых лугов и лесных полян с душистыми зонтиками цветков. Корень традиционно применяют при лёгком
  нервном напряжении и чтобы легче засыпать.
description: >-
  Многолетник до 180 см высотой с короткими подземными побегами. Листья супротивные, непарноперистые, из
  ланцетных долей, форма которых сильно меняется от растения к растению. Соцветие — щитковидный «зонтик» из
  множества мелких розовых или белых цветков, они сильно пахнут.
  Цветёт в июне–августе (данные для Средней Европы).
habitats: [forest-edge, wet-meadow, riverbank]
harvest:
  - part: rhizome-roots
    months: [4, 9, 10]
    how: >-
      По ГФ корневища с корнями собирают осенью или ранней весной; месяцы здесь ориентировочные — сентябрь–октябрь и
      апрель, точные сроки зависят от региона. Выкопанные корневища освобождают от остатков листьев и стеблей и
      отмывают от земли. По ГФ в сырье допускается не больше 5 % других частей валерианы (остатков стеблей и листьев,
      старых отмерших корневищ). Собранное сразу кладут в чистую тару, а не на землю (EMA GACP, раздел 11).
    drying: >-
      Раскладывают тонким слоем на рамах или сетках, приподнятых над землёй, чтобы воздух свободно проходил; сырьё должно
      просыхать равномерно, иначе появится плесень. Конкретных температур в источниках нет. Готовое сырьё по ГФ —
      влажность не более 15 %.
    storage: >-
      Хранят в чистом, хорошо проветриваемом помещении, защищённом от насекомых и грызунов, от прямого и яркого
      рассеянного света, при относительной влажности воздуха не более 65 %. Срок годности в ГФ не указан.
    sources:
      - {id: gf15-valerianae-rhizomata-cum-radicibus, page: "определение, испытания"}
      - {id: ema-gacp-2025, page: "11, 12"}
      - {id: gf15-khranenie-lrs, page: "общие требования"}
substances: [valerenic-acids]
actions: [sedative]
indications:
  - indication: nervous-restlessness-sleep
    evidence:
      level: traditional
      note: >-
        EMA (2016): для сухого экстракта — хорошо изученное применение при лёгком нервном напряжении и нарушениях сна;
        для чая и других форм — традиционное применение, чтобы легче засыпать. Но зонтичный обзор 2024 г.
        (8 систематических обзоров) не нашёл доказательств эффективности при бессоннице — есть только субъективное
        улучшение качества сна. При таком противоречии берём более осторожный уровень — «традиционное».
    sources:
      - {id: ema-valerianae-radix, page: "4.1, 4.2"}
      - {id: valente-2024-valerian-insomnia}
  - indication: mental-stress-mild
    evidence:
      level: traditional
      note: >-
        EMA (2016): традиционное применение — облегчение лёгких проявлений психического стресса; основано только на
        многолетнем опыте.
    sources:
      - {id: ema-valerianae-radix, page: "4.1"}
usage:
  - form: tea
    recipe: >-
      0,3–3 г измельчённого корня залить 150 мл кипятка и настоять (время настаивания в монографии не указано).
    dosage: >-
      Подросткам с 12 лет, взрослым и пожилым. При стрессе — до 3 раз в день. Чтобы легче заснуть — за полчаса–час до
      сна, при необходимости ещё раз раньше вечером. Не больше 4 приёмов в сутки.
    course: >-
      Действует постепенно и не подходит для быстрой помощи; лучший эффект — при приёме 2–4 недели. Если через 2 недели
      симптомы не проходят или ухудшаются — обратиться к врачу или фармацевту.
    for_indications: [nervous-restlessness-sleep, mental-stress-mild]
    sources:
      - {id: ema-valerianae-radix, page: "4.2"}
  - form: bath
    recipe: 100 г корня на полную ванну; температура воды 34–37 °C, ванна 10–20 минут.
    dosage: Не больше 1 ванны в день; детям до 12 лет не рекомендуется.
    for_indications: [mental-stress-mild, nervous-restlessness-sleep]
    sources:
      - {id: ema-valerianae-radix, page: "4.2"}
safety:
  pregnancy: caution
  lactation: caution
  children:
    status: ok
    from_age: 12
  toxicity: low
  contraindications:
    - "Аллергия (повышенная чувствительность) на валериану — применять нельзя (EMA 4.3)."
    - "Ванны с валерианой нельзя при открытых ранах, обширных повреждениях кожи, острых кожных болезнях, высокой температуре, тяжёлых инфекциях, тяжёлых нарушениях кровообращения и сердечной недостаточности (EMA 4.3)."
  warnings:
    - "Может ухудшать способность водить машину и работать с механизмами — в таком состоянии не садиться за руль (EMA 4.7)."
    - "Дети до 12 лет: применение не установлено из-за нехватки данных — не рекомендуется (EMA 4.4)."
    - "Беременность и кормление: безопасность не установлена; из-за нехватки данных применять не рекомендуется (EMA 4.6)."
    - "Если симптомы ухудшаются — обратиться к врачу (EMA 4.4)."
  side_effects:
    - "После приёма внутрь возможны тошнота и спазмы в животе; частота неизвестна (EMA 4.8)."
    - "Около 20 г корня за раз вызывали усталость, спазмы в животе, стеснение в груди, головокружение, дрожь рук и расширение зрачков; симптомы прошли за сутки (EMA 4.9)."
  interactions:
    - "Взаимодействий с лекарствами не описано (EMA 4.5)."
  sources:
    - {id: ema-valerianae-radix, page: "4.2–4.9"}
sources:
  - {id: bayreuth-artenkenntnis-valeriana-officinalis}
  - {id: gf15-valerianae-rhizomata-cum-radicibus, page: "определение; количественное определение (валереновые кислоты)"}
