id: rotokan-mouth-rinse
name: Ромашка, календула и тысячелистник для полоскания рта
purpose: [mouth-throat-inflammation]
components:
  - {herb: matricaria-chamomilla, parts: 2, part: flowers}
  - {herb: calendula-officinalis, parts: 1, part: flowers}
  - {herb: achillea-millefolium, parts: 1, part: herb}
preparation: >-
  Это состав зарегистрированного в России препарата «Ротокан» — жидкого экстракта на 40 % спирте, а не домашнего
  настоя: на 1000 мл экстракта берут 500 г цветков ромашки, по 250 г цветков календулы и травы тысячелистника. Для
  полоскания 1 чайную ложку экстракта разводят в стакане тёплой кипячёной воды; при хорошей переносимости — до 3 ложек.
dosage: >-
  Взрослым: полоскать рот 1–2 минуты 2–3 раза в день, курс 2–5 дней. Показания по инструкции — афтозный стоматит,
  пародонтит, язвенно-некротический гингивостоматит.
evidence:
  level: traditional
  note: >-
    Зарегистрированный в России препарат (ЛС-000367); показания официальные, но клинических исследований в инструкции
    нет. Каждое из трёх растений по отдельности EMA признаёт как традиционное средство при воспалениях во рту.
sources:
  - {id: label-rotokan-moskovskaya-ff, page: "состав, показания, способ применения"}
safety_note: >-
  Экстракт на спирту. Нельзя при аллергии на компоненты (ромашку, календулу, тысячелистник и другие астровые).
  Возможны аллергические реакции. Сведений о беременности, кормлении и применении у детей в инструкции нет — в этих
  случаях только после консультации врача.
